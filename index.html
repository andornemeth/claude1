<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorkert Szimulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#ff0;font-size:16px;text-align:center;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000}
#carrying{position:fixed;top:35px;left:50%;transform:translateX(-50%);color:#fa0;font-size:14px;text-align:center;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000;display:none}
#timer{position:fixed;top:8px;right:12px;color:#f55;font-size:18px;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;color:#fa0;text-align:center;padding:20px}
#overlay h1{font-size:28px;margin-bottom:8px;text-shadow:0 0 20px #fa0}
#overlay h2{font-size:16px;color:#fc0;margin-bottom:15px}
#overlay p{font-size:13px;margin:4px 0;color:#ddd}
#overlay .bl{animation:bl 1s infinite;margin-top:20px;font-size:18px;color:#ff0}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.3}}
#actionBtn{position:fixed;bottom:25px;right:20px;width:90px;height:90px;border-radius:50%;background:rgba(255,170,0,0.6);border:3px solid #fa0;color:#fff;font-size:16px;font-weight:bold;font-family:'Courier New',monospace;z-index:15;display:none;justify-content:center;align-items:center;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#joyBase{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(0,255,255,0.3);background:rgba(0,255,255,0.08);z-index:15;display:none;justify-content:center;align-items:center;touch-action:none}
#joyKnob{width:50px;height:50px;border-radius:50%;background:rgba(0,255,255,0.5);border:2px solid #0ff;pointer-events:none;position:absolute;left:35px;top:35px}
</style>
</head>
<body>
<div id="ui"><span id="sc">PONT: 0</span></div>
<div id="timer">IDO: 90</div>
<div id="carrying">SORT VISZEL!</div>
<div id="overlay">
  <h1>SORKERT SZIMULATOR</h1>
  <h2>Szolgald ki a vendegeket!</h2>
  <p>Menj a CSAPHOZ (sarga pult) sorert</p>
  <p>Vidd a PIROS jelzesu asztalokhoz</p>
  <p>90 masodperced van!</p>
  <p style="margin-top:8px;color:#aaa">Mobil: Joystick + Gomb</p>
  <p style="color:#aaa">PC: WASD + SPACE</p>
  <p class="bl">KOPPINTS AZ INDITASHOZ</p>
</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<button id="actionBtn">FELVSZ</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var scene,camera,renderer,player,clock;
var gameState='start',score=0,timeLeft=90;
var tables=[],bar=null;
var carrying=false;
var keys={};
var playerAngle=0;
var isMobile='ontouchstart' in window||navigator.maxTouchPoints>0;
var joyDX=0,joyDZ=0,joyActive=false,joyId=null;
var timerInt=null,needInt=null;

var scEl=document.getElementById('sc');
var tmEl=document.getElementById('timer');
var carEl=document.getElementById('carrying');
var ovEl=document.getElementById('overlay');
var actBtn=document.getElementById('actionBtn');
var joyBase=document.getElementById('joyBase');
var joyKnob=document.getElementById('joyKnob');

if(isMobile){actBtn.style.display='flex';joyBase.style.display='flex';}

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0a2e);
  scene.fog=new THREE.Fog(0x0a0a2e,20,45);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true,canvas:document.getElementById('c')});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  clock=new THREE.Clock();

  scene.add(new THREE.AmbientLight(0x334455,0.6));
  var moon=new THREE.DirectionalLight(0x8899bb,0.4);
  moon.position.set(10,20,5);moon.castShadow=true;scene.add(moon);

  var lps=[[-6,4,-6],[6,4,-6],[-6,4,6],[6,4,6],[0,4,0],[-3,4,-3],[3,4,-3],[-3,4,3],[3,4,3],[0,4,-8],[0,4,8],[-8,4,0],[8,4,0]];
  for(var i=0;i<lps.length;i++){
    var pl=new THREE.PointLight(0xffaa44,0.5,12);pl.position.set(lps[i][0],lps[i][1],lps[i][2]);scene.add(pl);
    var b=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),new THREE.MeshBasicMaterial({color:0xffdd66}));b.position.copy(pl.position);scene.add(b);
  }

  var gnd=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x2d5a1e}));
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
  var grv=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({color:0x8a7a5a}));
  grv.rotation.x=-Math.PI/2;grv.position.y=0.01;scene.add(grv);

  var fm=new THREE.MeshLambertMaterial({color:0x5c3a1e});
  for(var fx=-10;fx<=10;fx+=1){for(var s=0;s<4;s++){var p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.2,0.1),fm);if(s===0)p.position.set(fx,0.6,-10);else if(s===1)p.position.set(fx,0.6,10);else if(s===2)p.position.set(-10,0.6,fx);else p.position.set(10,0.6,fx);scene.add(p);}}
  for(var s=0;s<4;s++){var r=new THREE.Mesh(new THREE.BoxGeometry(s<2?20:0.08,0.08,s<2?0.08:20),fm);if(s===0)r.position.set(0,0.9,-10);else if(s===1)r.position.set(0,0.9,10);else if(s===2)r.position.set(-10,0.9,0);else r.position.set(10,0.9,0);scene.add(r);}

  // Bar
  var bg=new THREE.Group();
  bg.add(mkBox(3,1.1,1.2,0xc8a84e,0,0.55,0));
  bg.add(mkBox(3.2,0.1,1.4,0x6b4226,0,1.15,0));
  var tap=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,8),new THREE.MeshLambertMaterial({color:0xdddddd}));tap.position.set(0,1.4,0);bg.add(tap);
  bg.add(mkBox(0.15,0.2,0.05,0x222222,0,1.7,0));
  var sgn=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.4,0.05),new THREE.MeshBasicMaterial({color:0xffcc00}));sgn.position.set(0,1.9,-0.6);bg.add(sgn);
  bg.position.set(0,0,-7);scene.add(bg);
  bar={x:0,z:-7};
  scene.add(new THREE.PointLight(0xffcc44,1,6).copy(new THREE.PointLight(0xffcc44,1,6)));var brl=new THREE.PointLight(0xffcc44,1,6);brl.position.set(0,2,-7);scene.add(brl);

  // Trees
  var tm=new THREE.MeshLambertMaterial({color:0x1a4a0a}),trm=new THREE.MeshLambertMaterial({color:0x4a2a0a});
  var tp=[[-8,-8],[8,-8],[-8,8],[8,8],[-5,-9],[5,-9],[-9,0],[9,0],[-5,9],[5,9]];
  for(var i=0;i<tp.length;i++){var tr=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2,8),trm);tr.position.set(tp[i][0],1,tp[i][1]);tr.castShadow=true;scene.add(tr);var lv=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,8),tm);lv.position.set(tp[i][0],3,tp[i][1]);lv.castShadow=true;scene.add(lv);}

  // Tables
  var tps=[[-5,-3],[-2,-3],[2,-3],[5,-3],[-5,1],[-2,1],[2,1],[5,1],[-5,5],[-2,5],[2,5],[5,5]];
  var tbm=new THREE.MeshLambertMaterial({color:0x6b4226}),bnm=new THREE.MeshLambertMaterial({color:0x5a3a1a});
  for(var t=0;t<tps.length;t++){
    var tg=new THREE.Group();
    var tt=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.08,1),tbm);tt.position.y=0.75;tt.castShadow=true;tg.add(tt);
    for(var lx=-1;lx<=1;lx+=2)for(var lz=-1;lz<=1;lz+=2){var lg=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.75,0.08),tbm);lg.position.set(lx*0.7,0.375,lz*0.35);tg.add(lg);}
    for(var bz=-1;bz<=1;bz+=2){var bn=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.3),bnm);bn.position.set(0,0.45,bz*0.8);tg.add(bn);}
    var ind=new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),new THREE.MeshBasicMaterial({color:0xff3333}));ind.position.y=1.5;ind.visible=false;tg.add(ind);
    var bm=mkBeer();bm.position.set(0,0.85,0);bm.visible=false;tg.add(bm);
    tg.position.set(tps[t][0],0,tps[t][1]);scene.add(tg);
    tables.push({group:tg,x:tps[t][0],z:tps[t][1],need:false,has:false,ind:ind,beer:bm,cd:0});
  }

  // Player
  var pg=new THREE.Group();
  pg.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.8,12),new THREE.MeshLambertMaterial({color:0xffffff}))); pg.children[0].position.y=0.7;
  var apr=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.4,0.15),new THREE.MeshLambertMaterial({color:0x2266aa}));apr.position.set(0,0.6,0.15);pg.add(apr);
  var hd=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),new THREE.MeshLambertMaterial({color:0xffcc99}));hd.position.y=1.25;pg.add(hd);
  for(var ll=-1;ll<=1;ll+=2){var plg=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.4,8),new THREE.MeshLambertMaterial({color:0x333333}));plg.position.set(ll*0.12,0.2,0);pg.add(plg);}
  var hb=mkBeer();hb.position.set(0.35,0.9,0.2);hb.visible=false;hb.name='hb';pg.add(hb);
  pg.position.set(0,0,0);scene.add(pg);player=pg;

  camera.position.set(0,8,8);camera.lookAt(0,0,0);
  window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
  setupInput();
  animate();
}

function mkBox(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;return m;}
function mkBeer(){var g=new THREE.Group();var gl=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.3,8),new THREE.MeshLambertMaterial({color:0xddaa22,transparent:true,opacity:0.8}));gl.position.y=0.15;g.add(gl);var fo=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.06,8),new THREE.MeshLambertMaterial({color:0xffffff}));fo.position.y=0.32;g.add(fo);return g;}

function setupInput(){
  document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
  document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});

  // Start/restart - only on overlay
  ovEl.addEventListener('click',startClick);
  ovEl.addEventListener('touchend',function(e){e.preventDefault();startClick();});

  // Action
  actBtn.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();doAction();},{passive:false});

  // Joystick on joyBase element
  joyBase.addEventListener('touchstart',function(e){
    e.preventDefault();e.stopPropagation();
    var t=e.changedTouches[0];
    joyId=t.identifier;
    joyActive=true;
    var rect=joyBase.getBoundingClientRect();
    var cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    updateJoy(t.clientX-cx, t.clientY-cy);
  },{passive:false});

  document.addEventListener('touchmove',function(e){
    if(!joyActive)return;
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===joyId){
        var t=e.changedTouches[i];
        var rect=joyBase.getBoundingClientRect();
        var cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        updateJoy(t.clientX-cx, t.clientY-cy);
      }
    }
  },{passive:false});

  document.addEventListener('touchend',function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===joyId){
        joyActive=false;joyId=null;joyDX=0;joyDZ=0;
        joyKnob.style.left='35px';joyKnob.style.top='35px';
      }
    }
  },{passive:false});

  document.addEventListener('touchcancel',function(){
    joyActive=false;joyId=null;joyDX=0;joyDZ=0;
    joyKnob.style.left='35px';joyKnob.style.top='35px';
  },{passive:false});
}

function updateJoy(dx,dy){
  var maxR=50;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
  joyDX=dx/maxR;
  joyDZ=dy/maxR;
  joyKnob.style.left=(35+dx)+'px';
  joyKnob.style.top=(35+dy)+'px';
}

function startClick(){
  if(gameState==='start'||gameState==='over'){
    gameState='playing';ovEl.style.display='none';startGame();
  }
}

function startGame(){
  score=0;timeLeft=90;carrying=false;
  carEl.style.display='none';
  player.getObjectByName('hb').visible=false;
  player.position.set(0,0,0);
  for(var i=0;i<tables.length;i++){tables[i].need=false;tables[i].has=false;tables[i].ind.visible=false;tables[i].beer.visible=false;tables[i].cd=0;}
  updUI();setNeed();setNeed();
  if(timerInt)clearInterval(timerInt);
  timerInt=setInterval(function(){if(gameState!=='playing')return;timeLeft--;tmEl.textContent='IDO: '+timeLeft;if(timeLeft<=0)endGame();},1000);
  if(needInt)clearInterval(needInt);
  needInt=setInterval(function(){if(gameState!=='playing')return;setNeed();},4000);
}

function setNeed(){
  var av=[];for(var i=0;i<tables.length;i++){if(!tables[i].need&&!tables[i].has)av.push(i);}
  if(av.length===0)return;
  var idx=av[Math.floor(Math.random()*av.length)];
  tables[idx].need=true;tables[idx].ind.visible=true;tables[idx].ind.material.color.setHex(0xff3333);
}

function endGame(){
  gameState='over';if(timerInt)clearInterval(timerInt);if(needInt)clearInterval(needInt);
  document.getElementById('overlay').querySelector('h1').textContent='VEGE!';
  document.getElementById('overlay').querySelector('h2').textContent='Kiszolgaltal '+score+' sort!';
  ovEl.style.display='flex';
}

function updUI(){scEl.textContent='PONT: '+score;tmEl.textContent='IDO: '+timeLeft;}

function doAction(){
  if(gameState!=='playing')return;
  var px=player.position.x,pz=player.position.z;
  if(!carrying){
    var db=Math.sqrt((px-bar.x)*(px-bar.x)+(pz-bar.z)*(pz-bar.z));
    if(db<2.5){carrying=true;carEl.style.display='block';player.getObjectByName('hb').visible=true;actBtn.textContent='LETESZ';}
  }else{
    for(var i=0;i<tables.length;i++){
      var t=tables[i];if(!t.need)continue;
      var d=Math.sqrt((px-t.x)*(px-t.x)+(pz-t.z)*(pz-t.z));
      if(d<2.2){
        t.need=false;t.has=true;t.ind.visible=false;t.beer.visible=true;t.cd=300;
        carrying=false;carEl.style.display='none';player.getObjectByName('hb').visible=false;
        score++;updUI();actBtn.textContent='FELVSZ';
        t.ind.material.color.setHex(0x33ff33);t.ind.visible=true;
        setTimeout((function(tb){return function(){tb.ind.visible=false;};})(t),500);
        break;
      }
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta();
  if(gameState==='playing'){
    var dx=0,dz=0;
    if(keys['w']||keys['arrowup'])dz=-1;
    if(keys['s']||keys['arrowdown'])dz=1;
    if(keys['a']||keys['arrowleft'])dx=-1;
    if(keys['d']||keys['arrowright'])dx=1;
    dx+=joyDX;dz+=joyDZ;
    var len=Math.sqrt(dx*dx+dz*dz);if(len>1){dx/=len;dz/=len;}
    var spd=5*dt;
    player.position.x=Math.max(-9,Math.min(9,player.position.x+dx*spd));
    player.position.z=Math.max(-9,Math.min(9,player.position.z+dz*spd));
    if(len>0.1){playerAngle=Math.atan2(dx,dz);player.rotation.y=playerAngle;}
    if(keys[' ']){keys[' ']=false;doAction();}
    var time=Date.now()*0.003;
    for(var i=0;i<tables.length;i++){
      if(tables[i].need){tables[i].ind.position.y=1.5+Math.sin(time+i)*0.2;tables[i].ind.scale.setScalar(0.8+Math.sin(time*2+i)*0.2);}
      if(tables[i].has){tables[i].cd--;if(tables[i].cd<=0){tables[i].has=false;tables[i].beer.visible=false;}}
    }
    camera.position.x+=(player.position.x-camera.position.x)*2*dt;
    camera.position.z+=(player.position.z+8-camera.position.z)*2*dt;
    camera.lookAt(player.position.x,0,player.position.z);
  }
  renderer.render(scene,camera);
}

init();
</script>
<canvas id="c"></canvas>
</body>
</html>
