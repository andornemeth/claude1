<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorkert Szimulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hud{position:fixed;pointer-events:none;z-index:10;color:#ff0;font-size:16px;text-shadow:2px 2px 4px #000}
#sc{top:8px;left:50%;transform:translateX(-50%)}
#tm{top:8px;right:12px;color:#f55;font-size:18px}
#cr{top:32px;left:50%;transform:translateX(-50%);color:#fa0;font-size:14px;display:none}
#msg{top:55px;left:50%;transform:translateX(-50%);color:#4f4;font-size:13px;display:none}
#ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;color:#fa0;text-align:center;padding:20px}
#ov h1{font-size:28px;margin-bottom:8px;text-shadow:0 0 20px #fa0}
#ov h2{font-size:16px;color:#fc0;margin-bottom:15px}
#ov p{font-size:13px;margin:4px 0;color:#ddd}
.bl{animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.3}}
#hud2d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="sc" class="hud"></div>
<div id="tm" class="hud"></div>
<div id="cr" class="hud"></div>
<div id="msg" class="hud"></div>
<div id="ov">
  <h1 id="ovT"></h1>
  <h2 id="ovS"></h2>
  <p id="ovI1"></p>
  <p id="ovI2"></p>
  <p id="ovI3"></p>
  <p id="ovM" style="margin-top:8px;color:#aaa"></p>
  <p id="ovP" style="color:#aaa"></p>
  <p class="bl" id="ovStart" style="margin-top:20px;font-size:18px;color:#ff0"></p>
</div>
<canvas id="hud2d"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// i18n
var lc=(navigator.language||'en').substring(0,2);
var lang=lc==='hu'?'hu':lc==='sr'?'sr':'en';
var T={
  hu:{score:'PONT',time:'IDO',carrying:'SORT VISZEL!',title:'SORKERT SZIMULATOR',subtitle:'Szolgald ki a vendegeket!',
    inst1:'Menj a CSAPHOZ (sarga pult hatol) sorert',inst2:'Vidd a PIROS jelzesu asztalokhoz',inst3:'90 masodperced van!',
    mobile:'Mobil: Bal ujj mozog, Jobb ujj gomb',pc:'PC: WASD + SPACE',start:'KOPPINTS AZ INDITASHOZ',
    pickup:'FELVSZ',putdown:'LETESZ',move:'MOZGAS',
    gotBeer:'Sort vettel! Vidd egy piros asztalhoz!',goBar:'Menj a sarga CSAPHOZ hatol!',
    goTable:'Menj egy PIROS jelzesu asztalhoz!',plusOne:'+1 PONT! Menj ujabb sorert!',
    hintPickup:'>> NYOMD A GOMBOT SORERT <<',hintDrop:'>> NYOMD A GOMBOT LETESZNI <<',
    end:'VEGE!',endScore:function(n){return 'Kiszolgaltal '+n+' sort!';}},
  sr:{score:'POENI',time:'VREME',carrying:'NOSIS PIVO!',title:'BASTA SIMULATOR',subtitle:'Posluzi goste!',
    inst1:'Idi do TOCKA (zuti sank pozadi) za pivo',inst2:'Odnesi do stolova sa CRVENIM indikatorom',inst3:'Imas 90 sekundi!',
    mobile:'Mobil: Levi palac pomera, Desni palac dugme',pc:'PC: WASD + SPACE',start:'DODIRNI ZA POCETAK',
    pickup:'UZMI',putdown:'POSLUZI',move:'POMERI',
    gotBeer:'Uzeo si pivo! Odnesi do crvenog stola!',goBar:'Idi do zutog TOCKA pozadi!',
    goTable:'Idi do stola sa CRVENIM indikatorom!',plusOne:'+1 POEN! Idi po jos piva!',
    hintPickup:'>> PRITISNI DUGME ZA PIVO <<',hintDrop:'>> PRITISNI DUGME ZA SERVIS <<',
    end:'KRAJ!',endScore:function(n){return 'Posluzio si '+n+' piva!';}},
  en:{score:'SCORE',time:'TIME',carrying:'CARRYING BEER!',title:'BEER GARDEN SIM',subtitle:'Serve the customers!',
    inst1:'Go to the TAP (yellow bar in back) for beer',inst2:'Bring it to tables with RED indicators',inst3:'You have 90 seconds!',
    mobile:'Mobile: Left thumb move, Right thumb button',pc:'PC: WASD + SPACE',start:'TAP TO START',
    pickup:'PICKUP',putdown:'SERVE',move:'MOVE',
    gotBeer:'Got beer! Bring it to a red table!',goBar:'Go to the yellow BAR in the back!',
    goTable:'Go to a table with RED indicator!',plusOne:'+1 POINT! Get more beer!',
    hintPickup:'>> PRESS BUTTON FOR BEER <<',hintDrop:'>> PRESS BUTTON TO SERVE <<',
    end:'GAME OVER!',endScore:function(n){return 'You served '+n+' beers!';}}
};
var t=T[lang];

var renderer,scene,camera,player,clock;
var GS='start',score=0,timeLeft=90;
var tables=[],barPos={x:0,z:-7};
var carrying=0,maxCarry=4,keys={},pAngle=0;
var isMob='ontouchstart'in window||navigator.maxTouchPoints>0;
var jDX=0,jDZ=0;
var timerI=null,needI=null;
var joyId=null,joyCX=0,joyCY=0;
var btnId=null;
var msgTimer=0;

// Shirt and skin color palettes
var shirtColors=[0xcc3333,0x3366cc,0x33aa33,0xcc9933,0x9933cc,0xcc6699,0x339999,0xff6600,0x6633cc,0xaaaa33];
var legoYellow=0xF2CD37; // Classic LEGO skin color
var hairColors=[0x222222,0x4a2a0a,0x8a6a3a,0x111111,0x663300,0xaa8844,0xcc4400];
var hairTypes=['flat','cap','tall']; // Different LEGO hair styles

function mkLego(shirtC,pantsC,hairC,hairType){
  var g=new THREE.Group();
  var ym=new THREE.MeshLambertMaterial({color:legoYellow});
  // Head - cylinder with rounded top (LEGO minifig style)
  var head=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.18,12),ym);
  head.position.y=0.95;g.add(head);
  // Head stud on top
  var stud=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.04,8),ym);
  stud.position.y=1.06;g.add(stud);
  // Eyes - two small black dots
  for(var ex=-1;ex<=1;ex+=2){
    var eye=new THREE.Mesh(new THREE.SphereGeometry(0.02,6,6),new THREE.MeshBasicMaterial({color:0x000000}));
    eye.position.set(ex*0.05,0.96,0.13);g.add(eye);
  }
  // Smile
  var smile=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.015,0.02),new THREE.MeshBasicMaterial({color:0x000000}));
  smile.position.set(0,0.9,0.135);g.add(smile);
  // Hair
  var hm=new THREE.MeshLambertMaterial({color:hairC});
  if(hairType==='flat'){
    var h=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.06,12),hm);
    h.position.y=1.06;g.add(h);
  }else if(hairType==='cap'){
    var h=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.16,0.12,12),hm);
    h.position.y=1.08;g.add(h);
    var brim=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.02,0.1),hm);
    brim.position.set(0,1.04,0.12);g.add(brim);
  }else{
    var h=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.155,0.14,12),hm);
    h.position.y=1.1;g.add(h);
  }
  // Torso - blocky LEGO body
  var torso=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.32,0.2),new THREE.MeshLambertMaterial({color:shirtC}));
  torso.position.y=0.68;g.add(torso);
  // Arms - C-shaped LEGO arms (cylinder + hand)
  for(var s=-1;s<=1;s+=2){
    var arm=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.28,8),new THREE.MeshLambertMaterial({color:shirtC}));
    arm.position.set(s*0.22,0.65,0);g.add(arm);
    // LEGO claw hand
    var hand=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.06,8),ym);
    hand.position.set(s*0.22,0.49,0);g.add(hand);
  }
  // Hips
  var hips=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.08,0.18),new THREE.MeshLambertMaterial({color:pantsC}));
  hips.position.y=0.5;g.add(hips);
  // Legs - two rectangular LEGO legs
  for(var s=-1;s<=1;s+=2){
    var leg=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.3,0.16),new THREE.MeshLambertMaterial({color:pantsC}));
    leg.position.set(s*0.085,0.3,0);g.add(leg);
    // Foot
    var foot=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.05,0.2),new THREE.MeshLambertMaterial({color:pantsC}));
    foot.position.set(s*0.085,0.15,0.02);g.add(foot);
  }
  return g;
}

var pantsColors=[0x1a1a8a,0x333333,0x2a5a2a,0x5a2a1a,0x444444,0x1a3a6a];

function mkPerson(shirtC,unused){
  var pc=pantsColors[Math.floor(Math.random()*pantsColors.length)];
  var hc=hairColors[Math.floor(Math.random()*hairColors.length)];
  var ht=hairTypes[Math.floor(Math.random()*hairTypes.length)];
  return mkLego(shirtC,pc,hc,ht);
}

function addPeopleToTable(tg){
  var seats=[{x:-0.5,z:0.8,ry:Math.PI},{x:0.5,z:0.8,ry:Math.PI},{x:-0.5,z:-0.8,ry:0},{x:0.5,z:-0.8,ry:0}];
  var count=2+Math.floor(Math.random()*3); // 2-4 people
  for(var i=0;i<Math.min(count,seats.length);i++){
    var s=seats[i];
    var sc=shirtColors[Math.floor(Math.random()*shirtColors.length)];
    var p=mkPerson(sc);
    p.position.set(s.x,0,s.z);p.rotation.y=s.ry;
    tg.add(p);
  }
}

var hud=document.getElementById('hud2d');
var hctx=hud.getContext('2d');
function resizeHud(){hud.width=window.innerWidth;hud.height=window.innerHeight;}
resizeHud();window.addEventListener('resize',resizeHud);

function showMsg(txt){document.getElementById('msg').textContent=txt;document.getElementById('msg').style.display='block';msgTimer=120;}

// Set i18n overlay text
function setOverlayText(){
  document.getElementById('ovT').textContent=t.title;
  document.getElementById('ovS').textContent=t.subtitle;
  document.getElementById('ovI1').textContent=t.inst1;
  document.getElementById('ovI2').textContent=t.inst2;
  document.getElementById('ovI3').textContent=t.inst3;
  document.getElementById('ovM').textContent=t.mobile;
  document.getElementById('ovP').textContent=t.pc;
  document.getElementById('ovStart').textContent=t.start;
}
setOverlayText();

function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,25,55);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;
  renderer.domElement.style.cssText='display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1';
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  clock=new THREE.Clock();

  // Warm sunny lighting - balanced to avoid washing out
  scene.add(new THREE.AmbientLight(0xfff5e0,0.45));
  var sun=new THREE.DirectionalLight(0xfff8e1,0.75);sun.position.set(8,15,5);sun.castShadow=true;
  sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;sun.shadow.camera.near=0.5;sun.shadow.camera.far=50;
  sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;
  scene.add(sun);
  // Soft fill light from opposite side
  var fill=new THREE.DirectionalLight(0xe8e0d4,0.2);fill.position.set(-5,8,-5);scene.add(fill);
  // Hemisphere: sky blue top, earthy green bottom
  scene.add(new THREE.HemisphereLight(0x88bbdd,0x556B2F,0.35));
  // String lights (decorative, visible but not strong in daylight)
  var lp=[[-6,3.5,-6],[6,3.5,-6],[-6,3.5,6],[6,3.5,6],[0,3.5,0],[-3,3.5,-3],[3,3.5,-3],[-3,3.5,3],[3,3.5,3]];
  for(var i=0;i<lp.length;i++){var b=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),new THREE.MeshBasicMaterial({color:0xffeeaa}));b.position.set(lp[i][0],lp[i][1],lp[i][2]);scene.add(b);}

  // Procedural gravel texture - high contrast, no ellipse (Android compat)
  var gravelCanvas=document.createElement('canvas');gravelCanvas.width=512;gravelCanvas.height=512;
  var gctx=gravelCanvas.getContext('2d');
  // Sandy base
  gctx.fillStyle='#B8A07A';gctx.fillRect(0,0,512,512);
  // Noise layer
  for(var gy=0;gy<512;gy+=2){for(var gx=0;gx<512;gx+=2){
    var v=Math.floor(150+Math.random()*50);
    gctx.fillStyle='rgba('+v+','+Math.floor(v*0.9)+','+Math.floor(v*0.75)+',0.3)';
    gctx.fillRect(gx,gy,2,2);
  }}
  // Large pebbles
  for(var gi=0;gi<300;gi++){
    var px=Math.random()*512,py=Math.random()*512;
    var ps=Math.random()*6+3;
    var pv=Math.floor(120+Math.random()*80);
    gctx.fillStyle='rgb('+pv+','+Math.floor(pv*0.88)+','+Math.floor(pv*0.72)+')';
    gctx.beginPath();gctx.arc(px,py,ps,0,Math.PI*2);gctx.fill();
    // Highlight
    gctx.fillStyle='rgba(255,255,240,0.2)';
    gctx.beginPath();gctx.arc(px-ps*0.2,py-ps*0.2,ps*0.5,0,Math.PI*2);gctx.fill();
  }
  // Medium stones
  for(var gi=0;gi<500;gi++){
    var px=Math.random()*512,py=Math.random()*512;
    var ps=Math.random()*3+1.5;
    var pv=Math.floor(100+Math.random()*90);
    gctx.fillStyle='rgb('+pv+','+Math.floor(pv*0.9)+','+Math.floor(pv*0.78)+')';
    gctx.beginPath();gctx.arc(px,py,ps,0,Math.PI*2);gctx.fill();
  }
  // Dark grains for depth
  for(var gi=0;gi<600;gi++){
    var px=Math.random()*512,py=Math.random()*512;
    var ps=Math.random()*1.5+0.5;
    gctx.fillStyle='rgba(60,50,35,0.4)';
    gctx.beginPath();gctx.arc(px,py,ps,0,Math.PI*2);gctx.fill();
  }
  var gravelTex=new THREE.CanvasTexture(gravelCanvas);
  gravelTex.wrapS=THREE.RepeatWrapping;gravelTex.wrapT=THREE.RepeatWrapping;
  gravelTex.repeat.set(4,4);

  // Procedural grass texture
  var grassCanvas=document.createElement('canvas');grassCanvas.width=512;grassCanvas.height=512;
  var grctx=grassCanvas.getContext('2d');
  grctx.fillStyle='#3d7a32';grctx.fillRect(0,0,512,512);
  // Grass variation
  for(var gy=0;gy<512;gy+=2){for(var gx=0;gx<512;gx+=2){
    var v=Math.floor(40+Math.random()*30);
    var gg=Math.floor(90+Math.random()*50);
    grctx.fillStyle='rgba('+v+','+gg+','+Math.floor(v*0.6)+',0.4)';
    grctx.fillRect(gx,gy,2,2);
  }}
  // Grass blades
  for(var gi=0;gi<2000;gi++){
    var px=Math.random()*512,py=Math.random()*512;
    var gv=Math.floor(45+Math.random()*40);
    var gg=Math.floor(100+Math.random()*60);
    grctx.strokeStyle='rgb('+gv+','+gg+','+Math.floor(gv*0.5)+')';
    grctx.lineWidth=1;
    grctx.beginPath();grctx.moveTo(px,py);grctx.lineTo(px+Math.random()*6-3,py-Math.random()*8);grctx.stroke();
  }
  var grassTex=new THREE.CanvasTexture(grassCanvas);
  grassTex.wrapS=THREE.RepeatWrapping;grassTex.wrapT=THREE.RepeatWrapping;
  grassTex.repeat.set(6,6);

  // Ground - textured grass
  var g1=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshPhongMaterial({map:grassTex,shininess:2,specular:0x111111}));
  g1.rotation.x=-Math.PI/2;g1.receiveShadow=true;scene.add(g1);
  // Gravel patio area
  var g2=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshPhongMaterial({map:gravelTex,shininess:3,specular:0x222222}));
  g2.rotation.x=-Math.PI/2;g2.position.y=0.02;g2.receiveShadow=true;scene.add(g2);
  // Stone border between gravel and grass
  var borderMat=new THREE.MeshPhongMaterial({color:0x7a6a50,shininess:5});
  [-10,10].forEach(function(edge){
    var bh=new THREE.Mesh(new THREE.BoxGeometry(20,0.06,0.18),borderMat);bh.position.set(0,0.04,edge);scene.add(bh);
    var bv=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.06,20),borderMat);bv.position.set(edge,0.04,0);scene.add(bv);
  });

  // Fence - warm wood
  var fm=new THREE.MeshLambertMaterial({color:0x8B6914});
  for(var x=-10;x<=10;x++){for(var s=0;s<4;s++){var p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.2,0.1),fm);if(s===0)p.position.set(x,0.6,-10);else if(s===1)p.position.set(x,0.6,10);else if(s===2)p.position.set(-10,0.6,x);else p.position.set(10,0.6,x);scene.add(p);}}
  for(var s=0;s<4;s++){var r=new THREE.Mesh(new THREE.BoxGeometry(s<2?20:0.08,0.08,s<2?0.08:20),fm);if(s===0)r.position.set(0,0.9,-10);else if(s===1)r.position.set(0,0.9,10);else if(s===2)r.position.set(-10,0.9,0);else r.position.set(10,0.9,0);scene.add(r);}

  // Bar
  var bg=new THREE.Group();
  bg.add(mb(3,1.1,1.2,0xc8a84e,0,0.55,0));bg.add(mb(3.2,0.1,1.4,0x6b4226,0,1.15,0));
  var tap=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,8),new THREE.MeshLambertMaterial({color:0xdddddd}));tap.position.set(0,1.4,0);bg.add(tap);
  bg.add(mb(0.15,0.2,0.05,0x222222,0,1.7,0));
  var sn=new THREE.Mesh(new THREE.BoxGeometry(2,0.5,0.05),new THREE.MeshBasicMaterial({color:0xffcc00}));sn.position.set(0,1.9,-0.65);bg.add(sn);
  bg.position.set(0,0,-7);scene.add(bg);

  // Bartender - friendly bearded LEGO figure behind the bar, scaled up and visible
  var bartender=mkLego(0x228B22,0x1a1a1a,0x663300,'flat');
  bartender.scale.set(1.4,1.4,1.4);
  // Beard
  var beard=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.12,0.14),new THREE.MeshLambertMaterial({color:0x5c3317}));
  beard.position.set(0,0.85,0.12);bartender.add(beard);
  // Mustache
  var mustache=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.035,0.07),new THREE.MeshLambertMaterial({color:0x4a2810}));
  mustache.position.set(0,0.91,0.14);bartender.add(mustache);
  // Position: behind bar but elevated so head+body sticks out above the counter
  bartender.position.set(0,0.3,-7.8);
  // Face toward the player (toward +z)
  bartender.rotation.y=0;
  scene.add(bartender);

  // Trees - bright summer green
  var tm=new THREE.MeshLambertMaterial({color:0x2E8B2E}),trm=new THREE.MeshLambertMaterial({color:0x6B3A1F});
  [[-8,-8],[8,-8],[-8,8],[8,8],[-5,-9],[5,-9],[-9,0],[9,0],[-5,9],[5,9]].forEach(function(p){var t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2,8),trm);t.position.set(p[0],1,p[1]);t.castShadow=true;scene.add(t);var v=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,8),tm);v.position.set(p[0],3,p[1]);v.castShadow=true;scene.add(v);});

  // Tables
  var tbm=new THREE.MeshLambertMaterial({color:0x8B5E3C}),bnm=new THREE.MeshLambertMaterial({color:0x7A4F2E});
  [[-5,-3],[-2,-3],[2,-3],[5,-3],[-5,1],[-2,1],[2,1],[5,1],[-5,5],[-2,5],[2,5],[5,5]].forEach(function(pos){
    var tg=new THREE.Group();
    var tt=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.08,1),tbm);tt.position.y=0.75;tt.castShadow=true;tg.add(tt);
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(function(c){var lg=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.75,0.08),tbm);lg.position.set(c[0]*0.7,0.375,c[1]*0.35);tg.add(lg);});
    [-1,1].forEach(function(z){var bn=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.3),bnm);bn.position.set(0,0.45,z*0.8);tg.add(bn);});
    var ind=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,12),new THREE.MeshBasicMaterial({color:0xff3333}));ind.position.y=1.8;ind.visible=false;tg.add(ind);
    var bm=mkBeer();bm.position.set(0,0.85,0);bm.visible=false;tg.add(bm);
    addPeopleToTable(tg);
    tg.position.set(pos[0],0,pos[1]);scene.add(tg);
    tables.push({g:tg,x:pos[0],z:pos[1],need:false,has:false,ind:ind,beer:bm,cd:0});
  });

  // Player - LEGO waiter with white shirt and black pants
  var pg=mkLego(0xffffff,0x222222,0x4a2a0a,'flat');
  // Add blue apron over torso
  var apron=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.22),new THREE.MeshLambertMaterial({color:0x2266cc}));
  apron.position.set(0,0.58,0.01);pg.add(apron);
  // Tray on hand
  var tray=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.02,12),new THREE.MeshLambertMaterial({color:0x666666}));
  tray.position.set(0.3,0.52,0.1);tray.visible=false;tray.name='tray';pg.add(tray);
  // 4 beers on tray
  var beerPositions=[{x:0.1,z:0.05},{x:-0.1,z:0.05},{x:0.1,z:-0.05},{x:-0.1,z:-0.05}];
  for(var bi=0;bi<4;bi++){
    var hb=mkBeer();hb.scale.set(0.7,0.7,0.7);
    hb.position.set(0.3+beerPositions[bi].x,0.55,0.1+beerPositions[bi].z);
    hb.visible=false;hb.name='hb'+bi;pg.add(hb);
  }
  scene.add(pg);player=pg;

  // Sun sphere in sky
  var sunSphere=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16),new THREE.MeshBasicMaterial({color:0xFFFF88}));
  sunSphere.position.set(15,25,10);scene.add(sunSphere);
  // Clouds
  var cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.85});
  [[-12,18,-15],[8,16,-20],[20,17,-10],[-5,19,-25],[15,20,-18]].forEach(function(cp){
    var cg=new THREE.Group();
    for(var ci=0;ci<4;ci++){var cs=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*1.5,8,8),cloudMat);cs.position.set(ci*1.2-1.5,Math.random()*0.5,Math.random()*0.8);cs.scale.y=0.5;cg.add(cs);}
    cg.position.set(cp[0],cp[1],cp[2]);scene.add(cg);
  });

  camera.position.set(0,8,8);
  window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

  animate();
}

function mb(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;return m;}
function mkBeer(){var g=new THREE.Group();var gl=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.09,0.35,8),new THREE.MeshLambertMaterial({color:0xddaa22,transparent:true,opacity:0.8}));gl.position.y=0.175;g.add(gl);var fo=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.08,8),new THREE.MeshLambertMaterial({color:0xffffff}));fo.position.y=0.38;g.add(fo);return g;}

// Collision detection
function collides(px,pz){
  // Tables (box collision with padding)
  for(var i=0;i<tables.length;i++){
    var t=tables[i];
    var dx=Math.abs(px-t.x);
    var dz=Math.abs(pz-t.z);
    if(dx<1.3&&dz<1.1) return true;
  }
  // Bar
  var bdx=Math.abs(px-barPos.x);
  var bdz=Math.abs(pz-barPos.z);
  if(bdx<1.8&&bdz<0.9) return true;
  // Fence
  if(Math.abs(px)>9.3||Math.abs(pz)>9.3) return true;
  return false;
}

// Button: bottom right, BIG
function btnRect(){var s=Math.max(70,Math.min(window.innerWidth,window.innerHeight)*0.18);var m=15;return{x:window.innerWidth-s-m,y:window.innerHeight-s-m,r:s/2};}

function onTS(e){
  e.preventDefault();
  if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();return;}
  if(GS!=='playing')return;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var br=btnRect();
    var bx=t.clientX-(br.x+br.r),by=t.clientY-(br.y+br.r);
    // Big hit area for button
    if(bx*bx+by*by<(br.r+20)*(br.r+20)){
      btnId=t.identifier;doAction();
    }else if(t.clientX<window.innerWidth*0.6&&joyId===null){
      joyId=t.identifier;joyCX=t.clientX;joyCY=t.clientY;jDX=0;jDZ=0;
    }
  }
}
function onTM(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyId){
      var dx=t.clientX-joyCX,dy=t.clientY-joyCY;
      var dist=Math.sqrt(dx*dx+dy*dy),maxR=60;
      if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
      jDX=dx/maxR;jDZ=dy/maxR;
    }
  }
}
function onTE(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joyId){joyId=null;jDX=0;jDZ=0;}if(t.identifier===btnId)btnId=null;}}
function onTC(){joyId=null;btnId=null;jDX=0;jDZ=0;}

function updateBeerVisuals(){
  var trayObj=player.getObjectByName('tray');
  if(trayObj)trayObj.visible=carrying>0;
  for(var i=0;i<4;i++){
    var b=player.getObjectByName('hb'+i);
    if(b)b.visible=i<carrying;
  }
  if(carrying>0){
    document.getElementById('cr').textContent=(lang==='hu'?'SOR: ':lang==='sr'?'PIVO: ':'BEER: ')+carrying+'/'+maxCarry;
    document.getElementById('cr').style.display='block';
  }else{
    document.getElementById('cr').style.display='none';
  }
}

function doAction(){
  if(GS!=='playing')return;
  var px=player.position.x,pz=player.position.z;
  // Near bar - pick up beers (fill up to 4)
  var db=Math.sqrt((px-barPos.x)*(px-barPos.x)+(pz-barPos.z)*(pz-barPos.z));
  if(db<3.5&&carrying<maxCarry){
    carrying=maxCarry;
    updateBeerVisuals();
    showMsg(t.gotBeer);
    return;
  }
  // Have beers - deliver to closest needing table
  if(carrying>0){
    var closest=null,closestDist=Infinity;
    for(var i=0;i<tables.length;i++){
      var tb=tables[i];if(!tb.need)continue;
      var d=Math.sqrt((px-tb.x)*(px-tb.x)+(pz-tb.z)*(pz-tb.z));
      if(d<closestDist){closestDist=d;closest=tb;}
    }
    if(closest){
      closest.need=false;closest.has=true;closest.ind.visible=false;closest.beer.visible=true;closest.cd=300;
      carrying--;
      updateBeerVisuals();
      score++;updUI();
      closest.ind.material.color.setHex(0x33ff33);closest.ind.visible=true;
      setTimeout((function(tb){return function(){tb.ind.visible=false;};})(closest),500);
      showMsg(t.plusOne);
    }else{
      showMsg(t.goTable);
    }
  }else{
    showMsg(t.goBar);
  }
}

function startGame(){
  score=0;timeLeft=90;carrying=0;
  document.getElementById('cr').style.display='none';document.getElementById('msg').style.display='none';
  updateBeerVisuals();player.position.set(0,0,3);
  for(var i=0;i<tables.length;i++){tables[i].need=false;tables[i].has=false;tables[i].ind.visible=false;tables[i].beer.visible=false;tables[i].cd=0;}
  updUI();setN();setN();setN();
  if(timerI)clearInterval(timerI);
  timerI=setInterval(function(){if(GS!=='playing')return;timeLeft--;document.getElementById('tm').textContent=t.time+': '+timeLeft;if(timeLeft<=0)endG();},1000);
  if(needI)clearInterval(needI);
  needI=setInterval(function(){if(GS!=='playing')return;setN();},4000);
}

function setN(){var a=[];for(var i=0;i<tables.length;i++){if(!tables[i].need&&!tables[i].has)a.push(i);}if(!a.length)return;var idx=a[Math.floor(Math.random()*a.length)];tables[idx].need=true;tables[idx].ind.visible=true;tables[idx].ind.material.color.setHex(0xff3333);}
function endG(){GS='over';if(timerI)clearInterval(timerI);if(needI)clearInterval(needI);var ov=document.getElementById('ov');ov.querySelector('h1').textContent=t.end;ov.querySelector('h2').textContent=t.endScore(score);ov.style.display='flex';}
function updUI(){document.getElementById('sc').textContent=t.score+': '+score;document.getElementById('tm').textContent=t.time+': '+timeLeft;}

function drawHud(){
  hctx.clearRect(0,0,hud.width,hud.height);
  if(GS!=='playing')return;
  if(!isMob)return;
  // Joystick
  var jx,jy;
  if(joyId!==null){jx=joyCX;jy=joyCY;}else{jx=70;jy=hud.height-70;}
  hctx.globalAlpha=0.2;hctx.strokeStyle='#0ff';hctx.lineWidth=3;
  hctx.beginPath();hctx.arc(jx,jy,55,0,Math.PI*2);hctx.stroke();
  hctx.globalAlpha=0.5;hctx.fillStyle='#0ff';
  hctx.beginPath();hctx.arc(jx+jDX*45,jy+jDZ*45,18,0,Math.PI*2);hctx.fill();
  if(joyId===null){hctx.globalAlpha=0.4;hctx.fillStyle='#0ff';hctx.font='11px Courier New';hctx.textAlign='center';hctx.fillText(t.move,jx,jy+4);}
  // Action button - BIG
  var br=btnRect();
  var bcx=br.x+br.r,bcy=br.y+br.r;
  hctx.globalAlpha=0.4;hctx.fillStyle=carrying>0?'#4a4':'#fa0';
  hctx.beginPath();hctx.arc(bcx,bcy,br.r,0,Math.PI*2);hctx.fill();
  hctx.globalAlpha=1;hctx.strokeStyle=carrying>0?'#4f4':'#fc0';hctx.lineWidth=4;
  hctx.beginPath();hctx.arc(bcx,bcy,br.r,0,Math.PI*2);hctx.stroke();
  hctx.fillStyle='#fff';hctx.font='bold '+Math.max(14,Math.round(br.r*0.35))+'px Courier New';hctx.textAlign='center';hctx.textBaseline='middle';
  hctx.fillText(carrying>0?t.putdown+(carrying>1?' x'+carrying:''):t.pickup,bcx,bcy);
  // Proximity hint
  var px=player.position.x,pz=player.position.z;
  var nearBar=Math.sqrt((px-barPos.x)*(px-barPos.x)+(pz-barPos.z)*(pz-barPos.z))<3.5;
  var nearTable=false;
  for(var i=0;i<tables.length;i++){if(tables[i].need&&Math.sqrt((px-tables[i].x)*(px-tables[i].x)+(pz-tables[i].z)*(pz-tables[i].z))<3)nearTable=true;}
  if(carrying<maxCarry&&nearBar){
    hctx.globalAlpha=0.8;hctx.fillStyle='#ff0';hctx.font='bold 16px Courier New';hctx.textAlign='center';
    hctx.fillText(t.hintPickup,hud.width/2,hud.height/2);
  }else if(carrying>0&&nearTable){
    hctx.globalAlpha=0.8;hctx.fillStyle='#4f4';hctx.font='bold 16px Courier New';hctx.textAlign='center';
    hctx.fillText(t.hintDrop,hud.width/2,hud.height/2);
  }
  hctx.globalAlpha=1;
}

function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta();
  if(GS==='playing'){
    var dx=0,dz=0;
    if(keys['w']||keys['arrowup'])dz=-1;if(keys['s']||keys['arrowdown'])dz=1;
    if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
    dx+=jDX;dz+=jDZ;
    var len=Math.sqrt(dx*dx+dz*dz);if(len>1){dx/=len;dz/=len;}
    if(keys[' ']){keys[' ']=false;doAction();}
    // Move with collision
    var spd=5*dt;
    var nx=player.position.x+dx*spd;
    var nz=player.position.z+dz*spd;
    // Try X, then Z separately for sliding along walls
    if(!collides(nx,player.position.z)) player.position.x=nx;
    if(!collides(player.position.x,nz)) player.position.z=nz;
    if(len>0.1){pAngle=Math.atan2(dx,dz);player.rotation.y=pAngle;}
    // Animate indicators
    var tt=Date.now()*0.003;
    for(var i=0;i<tables.length;i++){if(tables[i].need){tables[i].ind.position.y=1.8+Math.sin(tt+i)*0.3;tables[i].ind.scale.setScalar(0.8+Math.sin(tt*2+i)*0.3);}if(tables[i].has){tables[i].cd--;if(tables[i].cd<=0){tables[i].has=false;tables[i].beer.visible=false;}}}
    // Camera
    camera.position.x+=(player.position.x-camera.position.x)*2*dt;
    camera.position.z+=(player.position.z+8-camera.position.z)*2*dt;
    camera.lookAt(player.position.x,0,player.position.z);
    // Message timer
    if(msgTimer>0){msgTimer--;if(msgTimer<=0)document.getElementById('msg').style.display='none';}
  }
  renderer.render(scene,camera);
  drawHud();
}

// Register events BEFORE init - so they work even if Three.js fails
function handleStart(){
  if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();}
}
document.addEventListener('touchstart',onTS,{passive:false});
document.addEventListener('touchmove',onTM,{passive:false});
document.addEventListener('touchend',onTE,{passive:false});
document.addEventListener('touchcancel',onTC,{passive:false});
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
document.addEventListener('click',handleStart);
// Also add direct tap handler on overlay as backup
document.getElementById('ov').addEventListener('touchend',function(e){e.preventDefault();handleStart();},{passive:false});

try{init();}catch(e){
  console.error('Init error:',e);
  document.getElementById('ov').querySelector('h2').textContent='Error: '+e.message;
}
</script>
</body>
</html>
