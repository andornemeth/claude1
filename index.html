<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sörkert Szimulátor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#ff0;font-size:18px;text-align:center;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000}
#carrying{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#fa0;font-size:16px;text-align:center;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000;display:none}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;color:#fa0;text-align:center;padding:20px}
#startScreen h1{font-size:32px;margin-bottom:10px;text-shadow:0 0 20px #fa0}
#startScreen h2{font-size:18px;color:#fc0;margin-bottom:20px}
#startScreen p{font-size:14px;margin:5px 0;color:#ddd}
#startScreen .blink{animation:blink 1s infinite;margin-top:25px;font-size:20px;color:#ff0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#gameOver{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20;color:#fa0;text-align:center}
#gameOver h2{font-size:30px;margin-bottom:10px}
#gameOver p{font-size:18px;margin:5px 0;color:#ddd}
#timer{position:absolute;top:10px;right:15px;color:#f55;font-size:20px;pointer-events:none;z-index:10;text-shadow:1px 1px 3px #000}
#joystickArea{position:absolute;bottom:0;left:0;width:50%;height:40%;z-index:15;touch-action:none}
#actionBtn{position:absolute;bottom:30px;right:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,170,0,0.5);border:3px solid #fa0;color:#fff;font-size:14px;font-weight:bold;z-index:15;display:none;touch-action:none;cursor:pointer}
@media(pointer:coarse){#actionBtn{display:flex;justify-content:center;align-items:center}}
</style>
</head>
<body>
<div id="ui"><span id="scoreDisplay">PONT: 0</span></div>
<div id="timer">IDO: 90</div>
<div id="carrying">SÖRT VISZEL!</div>
<div id="startScreen">
  <h1>SÖRKERT SZIMULÁTOR</h1>
  <h2>Szolgáld ki a vendégeket!</h2>
  <p>Menj a CSAPHOZ (sárga pult) sörért</p>
  <p>Vidd a PIROS jelzésű asztalokhoz</p>
  <p>90 másodperced van!</p>
  <p style="margin-top:10px;color:#aaa">WASD/Joystick: mozgás | SPACE/Gomb: felvesz/letesz</p>
  <p class="blink">KOPPINTS AZ INDÍTÁSHOZ</p>
</div>
<div id="gameOver">
  <h2 id="goTitle">VÉGE!</h2>
  <p id="goScore"></p>
  <p class="blink" style="margin-top:20px">KOPPINTS AZ ÚJRAKEZDÉSHEZ</p>
</div>
<div id="joystickArea"></div>
<button id="actionBtn">FELvesz</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var scene, camera, renderer, player, clock;
var gameState = 'start';
var score = 0, timeLeft = 90;
var tables = [], bar = null;
var carrying = false;
var keys = {};
var moveX = 0, moveZ = 0;
var playerAngle = 0;
var isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
var joystickTouch = null, joyStartX = 0, joyStartY = 0, joyDX = 0, joyDZ = 0;
var timerInterval = null;
var tableNeedTimer = null;

var scoreDisplay = document.getElementById('scoreDisplay');
var timerDisplay = document.getElementById('timer');
var carryingDisplay = document.getElementById('carrying');
var startScreenEl = document.getElementById('startScreen');
var gameOverEl = document.getElementById('gameOver');
var goTitle = document.getElementById('goTitle');
var goScore = document.getElementById('goScore');
var actionBtn = document.getElementById('actionBtn');
var joystickArea = document.getElementById('joystickArea');

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0a2e);
  scene.fog = new THREE.Fog(0x1a0a2e, 20, 50);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // Lights
  var ambient = new THREE.AmbientLight(0x334455, 0.6);
  scene.add(ambient);

  var moon = new THREE.DirectionalLight(0x8899bb, 0.4);
  moon.position.set(10, 20, 5);
  moon.castShadow = true;
  scene.add(moon);

  // Warm point lights (string lights effect)
  var lightPositions = [
    [-6,4,-6],[6,4,-6],[-6,4,6],[6,4,6],[0,4,0],
    [-3,4,-3],[3,4,-3],[-3,4,3],[3,4,3],
    [0,4,-8],[0,4,8],[-8,4,0],[8,4,0]
  ];
  for (var i = 0; i < lightPositions.length; i++) {
    var pl = new THREE.PointLight(0xffaa44, 0.5, 12);
    pl.position.set(lightPositions[i][0], lightPositions[i][1], lightPositions[i][2]);
    scene.add(pl);
    // Light bulb visual
    var bulbGeo = new THREE.SphereGeometry(0.1, 8, 8);
    var bulbMat = new THREE.MeshBasicMaterial({color: 0xffdd66});
    var bulb = new THREE.Mesh(bulbGeo, bulbMat);
    bulb.position.copy(pl.position);
    scene.add(bulb);
  }

  // Ground - grass
  var groundGeo = new THREE.PlaneGeometry(40, 40);
  var groundMat = new THREE.MeshLambertMaterial({color: 0x2d5a1e});
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Gravel area
  var gravelGeo = new THREE.PlaneGeometry(20, 20);
  var gravelMat = new THREE.MeshLambertMaterial({color: 0x8a7a5a});
  var gravel = new THREE.Mesh(gravelGeo, gravelMat);
  gravel.rotation.x = -Math.PI / 2;
  gravel.position.y = 0.01;
  scene.add(gravel);

  // Fence
  var fenceMat = new THREE.MeshLambertMaterial({color: 0x5c3a1e});
  for (var fx = -10; fx <= 10; fx += 1) {
    for (var side = 0; side < 4; side++) {
      var post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.1), fenceMat);
      if (side === 0) post.position.set(fx, 0.6, -10);
      else if (side === 1) post.position.set(fx, 0.6, 10);
      else if (side === 2) post.position.set(-10, 0.6, fx);
      else post.position.set(10, 0.6, fx);
      scene.add(post);
    }
  }
  // Fence rails
  for (var side = 0; side < 4; side++) {
    var rail = new THREE.Mesh(new THREE.BoxGeometry(side < 2 ? 20 : 0.08, 0.08, side < 2 ? 0.08 : 20), fenceMat);
    if (side === 0) rail.position.set(0, 0.9, -10);
    else if (side === 1) rail.position.set(0, 0.9, 10);
    else if (side === 2) rail.position.set(-10, 0.9, 0);
    else rail.position.set(10, 0.9, 0);
    scene.add(rail);
  }

  // Bar (csap)
  var barGroup = new THREE.Group();
  var barBase = new THREE.Mesh(new THREE.BoxGeometry(3, 1.1, 1.2), new THREE.MeshLambertMaterial({color: 0xc8a84e}));
  barBase.position.y = 0.55;
  barBase.castShadow = true;
  barGroup.add(barBase);
  // Bar top
  var barTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.4), new THREE.MeshLambertMaterial({color: 0x6b4226}));
  barTop.position.y = 1.15;
  barGroup.add(barTop);
  // Tap
  var tap = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.5, 8), new THREE.MeshLambertMaterial({color: 0xdddddd}));
  tap.position.set(0, 1.4, 0);
  barGroup.add(tap);
  var tapHandle = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.05), new THREE.MeshLambertMaterial({color: 0x222222}));
  tapHandle.position.set(0, 1.7, 0);
  barGroup.add(tapHandle);
  // Sign
  var sign = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 0.05), new THREE.MeshBasicMaterial({color: 0xffcc00}));
  sign.position.set(0, 1.9, -0.6);
  barGroup.add(sign);
  barGroup.position.set(0, 0, -7);
  scene.add(barGroup);
  bar = {group: barGroup, x: 0, z: -7};

  // Glow around bar
  var barLight = new THREE.PointLight(0xffcc44, 1, 6);
  barLight.position.set(0, 2, -7);
  scene.add(barLight);

  // Trees
  var treeMat = new THREE.MeshLambertMaterial({color: 0x1a4a0a});
  var trunkMat = new THREE.MeshLambertMaterial({color: 0x4a2a0a});
  var treePositions = [[-8,-8],[8,-8],[-8,8],[8,8],[-5,-9],[5,-9],[-9,0],[9,0],[-5,9],[5,9]];
  for (var ti = 0; ti < treePositions.length; ti++) {
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2, 8), trunkMat);
    trunk.position.set(treePositions[ti][0], 1, treePositions[ti][1]);
    trunk.castShadow = true;
    scene.add(trunk);
    var leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), treeMat);
    leaves.position.set(treePositions[ti][0], 3, treePositions[ti][1]);
    leaves.castShadow = true;
    scene.add(leaves);
  }

  // Tables
  var tablePositions = [
    [-5, -3], [-2, -3], [2, -3], [5, -3],
    [-5, 1], [-2, 1], [2, 1], [5, 1],
    [-5, 5], [-2, 5], [2, 5], [5, 5]
  ];
  var tableMat = new THREE.MeshLambertMaterial({color: 0x6b4226});
  var benchMat = new THREE.MeshLambertMaterial({color: 0x5a3a1a});

  for (var t = 0; t < tablePositions.length; t++) {
    var tg = new THREE.Group();
    // Table top
    var ttop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 1), tableMat);
    ttop.position.y = 0.75;
    ttop.castShadow = true;
    tg.add(ttop);
    // Legs
    for (var lx = -1; lx <= 1; lx += 2) {
      for (var lz = -1; lz <= 1; lz += 2) {
        var leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.75, 0.08), tableMat);
        leg.position.set(lx * 0.7, 0.375, lz * 0.35);
        tg.add(leg);
      }
    }
    // Benches
    for (var bz = -1; bz <= 1; bz += 2) {
      var bench = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.3), benchMat);
      bench.position.set(0, 0.45, bz * 0.8);
      tg.add(bench);
    }
    // Need indicator (red sphere above table, hidden by default)
    var indicator = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), new THREE.MeshBasicMaterial({color: 0xff3333}));
    indicator.position.y = 1.5;
    indicator.visible = false;
    tg.add(indicator);
    // Beer on table (hidden by default)
    var beerMesh = createBeerMesh();
    beerMesh.position.set(0, 0.85, 0);
    beerMesh.visible = false;
    tg.add(beerMesh);

    tg.position.set(tablePositions[t][0], 0, tablePositions[t][1]);
    scene.add(tg);
    tables.push({group: tg, x: tablePositions[t][0], z: tablePositions[t][1], needsBeer: false, hasBeer: false, indicator: indicator, beerMesh: beerMesh, cooldown: 0});
  }

  // Player
  var playerGroup = new THREE.Group();
  // Body
  var body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.8, 12), new THREE.MeshLambertMaterial({color: 0xffffff}));
  body.position.y = 0.7;
  playerGroup.add(body);
  // Apron
  var apron = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.15), new THREE.MeshLambertMaterial({color: 0x2266aa}));
  apron.position.set(0, 0.6, 0.15);
  playerGroup.add(apron);
  // Head
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), new THREE.MeshLambertMaterial({color: 0xffcc99}));
  head.position.y = 1.25;
  playerGroup.add(head);
  // Legs
  for (var ll = -1; ll <= 1; ll += 2) {
    var pleg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), new THREE.MeshLambertMaterial({color: 0x333333}));
    pleg.position.set(ll * 0.12, 0.2, 0);
    playerGroup.add(pleg);
  }
  // Beer in hand (hidden)
  var handBeer = createBeerMesh();
  handBeer.position.set(0.35, 0.9, 0.2);
  handBeer.visible = false;
  handBeer.name = 'handBeer';
  playerGroup.add(handBeer);

  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);
  player = playerGroup;

  // Camera setup
  camera.position.set(0, 8, 8);
  camera.lookAt(0, 0, 0);

  window.addEventListener('resize', onResize);
  setupInput();
  animate();
}

function createBeerMesh() {
  var bg = new THREE.Group();
  var glass = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.3, 8), new THREE.MeshLambertMaterial({color: 0xddaa22, transparent: true, opacity: 0.8}));
  glass.position.y = 0.15;
  bg.add(glass);
  var foam = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.06, 8), new THREE.MeshLambertMaterial({color: 0xffffff}));
  foam.position.y = 0.32;
  bg.add(foam);
  var handle = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.02, 6, 8, Math.PI), new THREE.MeshLambertMaterial({color: 0xaaaaaa}));
  handle.position.set(0.12, 0.15, 0);
  handle.rotation.z = Math.PI / 2;
  bg.add(handle);
  return bg;
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function setupInput() {
  document.addEventListener('keydown', function(e) { keys[e.key.toLowerCase()] = true; });
  document.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

  // Start/restart
  document.addEventListener('click', handleStartClick);
  document.addEventListener('touchend', handleStartClick);

  // Action button
  actionBtn.addEventListener('touchstart', function(e) { e.preventDefault(); doAction(); }, {passive: false});
  actionBtn.addEventListener('click', function(e) { e.preventDefault(); doAction(); });

  // Joystick
  joystickArea.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (gameState !== 'playing') return;
    var t = e.changedTouches[0];
    joystickTouch = t.identifier;
    joyStartX = t.clientX; joyStartY = t.clientY;
    joyDX = 0; joyDZ = 0;
  }, {passive: false});

  joystickArea.addEventListener('touchmove', function(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouch) {
        var t = e.changedTouches[i];
        var dx = t.clientX - joyStartX;
        var dy = t.clientY - joyStartY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var maxR = 60;
        if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
        joyDX = dx / maxR;
        joyDZ = dy / maxR;
      }
    }
  }, {passive: false});

  joystickArea.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouch) {
        joystickTouch = null; joyDX = 0; joyDZ = 0;
      }
    }
  }, {passive: false});

  joystickArea.addEventListener('touchcancel', function() {
    joystickTouch = null; joyDX = 0; joyDZ = 0;
  }, {passive: false});
}

function handleStartClick(e) {
  if (gameState === 'start') {
    gameState = 'playing';
    startScreenEl.style.display = 'none';
    startGame();
  } else if (gameState === 'over') {
    gameState = 'playing';
    gameOverEl.style.display = 'none';
    startGame();
  }
}

function startGame() {
  score = 0; timeLeft = 90; carrying = false;
  carryingDisplay.style.display = 'none';
  player.getObjectByName('handBeer').visible = false;
  player.position.set(0, 0, 0);
  for (var i = 0; i < tables.length; i++) {
    tables[i].needsBeer = false;
    tables[i].hasBeer = false;
    tables[i].indicator.visible = false;
    tables[i].beerMesh.visible = false;
    tables[i].cooldown = 0;
  }
  updateUI2();
  // Set 2-3 tables needing beer at start
  setRandomNeed();
  setRandomNeed();
  // Timer
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    if (gameState !== 'playing') return;
    timeLeft--;
    timerDisplay.textContent = 'IDO: ' + timeLeft;
    if (timeLeft <= 0) { endGame(); }
  }, 1000);
  // Periodically add needs
  if (tableNeedTimer) clearInterval(tableNeedTimer);
  tableNeedTimer = setInterval(function() {
    if (gameState !== 'playing') return;
    setRandomNeed();
  }, 4000);
}

function setRandomNeed() {
  var available = [];
  for (var i = 0; i < tables.length; i++) {
    if (!tables[i].needsBeer && !tables[i].hasBeer) available.push(i);
  }
  if (available.length === 0) return;
  var idx = available[Math.floor(Math.random() * available.length)];
  tables[idx].needsBeer = true;
  tables[idx].indicator.visible = true;
  tables[idx].indicator.material.color.setHex(0xff3333);
}

function endGame() {
  gameState = 'over';
  if (timerInterval) clearInterval(timerInterval);
  if (tableNeedTimer) clearInterval(tableNeedTimer);
  goTitle.textContent = 'VEGE!';
  goScore.textContent = 'Kiszolgaltál ' + score + ' sort!';
  gameOverEl.style.display = 'flex';
}

function updateUI2() {
  scoreDisplay.textContent = 'PONT: ' + score;
  timerDisplay.textContent = 'IDO: ' + timeLeft;
}

function doAction() {
  if (gameState !== 'playing') return;
  var px = player.position.x, pz = player.position.z;

  if (!carrying) {
    // Check if near bar
    var distBar = Math.sqrt((px - bar.x) * (px - bar.x) + (pz - bar.z) * (pz - bar.z));
    if (distBar < 2.5) {
      carrying = true;
      carryingDisplay.style.display = 'block';
      player.getObjectByName('handBeer').visible = true;
      actionBtn.textContent = 'LETESZ';
    }
  } else {
    // Check if near a table that needs beer
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      if (!t.needsBeer) continue;
      var dist = Math.sqrt((px - t.x) * (px - t.x) + (pz - t.z) * (pz - t.z));
      if (dist < 2) {
        t.needsBeer = false;
        t.hasBeer = true;
        t.indicator.visible = false;
        t.beerMesh.visible = true;
        t.cooldown = 300;
        carrying = false;
        carryingDisplay.style.display = 'none';
        player.getObjectByName('handBeer').visible = false;
        score++;
        updateUI2();
        actionBtn.textContent = 'FELVSZ';
        // Flash green
        t.indicator.material.color.setHex(0x33ff33);
        t.indicator.visible = true;
        setTimeout((function(tbl) { return function() { tbl.indicator.visible = false; }; })(t), 500);
        break;
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  var dt = clock.getDelta();
  if (gameState === 'playing') {
    // Movement
    var dx = 0, dz = 0;
    if (keys['w'] || keys['arrowup']) dz = -1;
    if (keys['s'] || keys['arrowdown']) dz = 1;
    if (keys['a'] || keys['arrowleft']) dx = -1;
    if (keys['d'] || keys['arrowright']) dx = 1;

    // Joystick
    dx += joyDX;
    dz += joyDZ;

    var len = Math.sqrt(dx * dx + dz * dz);
    if (len > 1) { dx /= len; dz /= len; }

    var speed = 5 * dt;
    player.position.x = Math.max(-9, Math.min(9, player.position.x + dx * speed));
    player.position.z = Math.max(-9, Math.min(9, player.position.z + dz * speed));

    // Rotate player to face movement direction
    if (len > 0.1) {
      playerAngle = Math.atan2(dx, dz);
      player.rotation.y = playerAngle;
    }

    // Space bar action
    if (keys[' ']) {
      keys[' '] = false;
      doAction();
    }

    // Animate indicators
    var time = Date.now() * 0.003;
    for (var i = 0; i < tables.length; i++) {
      if (tables[i].needsBeer) {
        tables[i].indicator.position.y = 1.5 + Math.sin(time + i) * 0.2;
        tables[i].indicator.scale.setScalar(0.8 + Math.sin(time * 2 + i) * 0.2);
      }
      // Beer cooldown
      if (tables[i].hasBeer) {
        tables[i].cooldown--;
        if (tables[i].cooldown <= 0) {
          tables[i].hasBeer = false;
          tables[i].beerMesh.visible = false;
        }
      }
    }

    // Camera follow
    camera.position.x += (player.position.x - camera.position.x) * 2 * dt;
    camera.position.z += (player.position.z + 8 - camera.position.z) * 2 * dt;
    camera.lookAt(player.position.x, 0, player.position.z);

    // Update action button text
    if (isMobile) {
      actionBtn.textContent = carrying ? 'LETESZ' : 'FELVSZ';
    }
  }
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
