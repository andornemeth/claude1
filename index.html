<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #000; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: 16px; text-align: center; pointer-events: none; z-index: 10; white-space: nowrap; }
#startScreen, #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0ff; text-align: center; z-index: 20; width: 90%; max-width: 500px; }
#startScreen h1 { font-size: 36px; margin-bottom: 15px; text-shadow: 0 0 20px #0ff; }
#startScreen p, #gameOver p { font-size: 16px; margin: 8px 0; }
#gameOver h2 { font-size: 30px; margin-bottom: 10px; color: #f44; text-shadow: 0 0 20px #f44; }
#gameOver { display: none; }
.blink { animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
#mobileHint { display: none; color: #888; font-size: 14px; margin-top: 10px; }
@media (pointer: coarse) { #mobileHint { display: block; } #desktopHint { display: none; } }
</style>
</head>
<body>
<div id="ui">
  <span id="scoreDisplay">SCORE: 0</span> &nbsp;
  <span id="livesDisplay">LIVES: 3</span> &nbsp;
  <span id="waveDisplay">WAVE: 1</span>
</div>
<div id="startScreen">
  <h1>SPACE SHOOTER</h1>
  <p id="desktopHint">WASD / Arrows to move | Mouse aim &amp; click to shoot</p>
  <p id="mobileHint">Left thumb: move | Right thumb: aim &amp; shoot</p>
  <p>Collect power-ups for upgrades!</p>
  <p class="blink" style="margin-top:25px; font-size:20px;">TAP TO START</p>
</div>
<div id="gameOver">
  <h2>GAME OVER</h2>
  <p id="finalScore"></p>
  <p class="blink" style="margin-top:20px;">TAP TO RESTART</p>
</div>
<canvas id="game"></canvas>

<script>
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var startScreen = document.getElementById('startScreen');
var gameOverScreen = document.getElementById('gameOver');
var scoreDisplay = document.getElementById('scoreDisplay');
var livesDisplay = document.getElementById('livesDisplay');
var waveDisplay = document.getElementById('waveDisplay');
var finalScoreEl = document.getElementById('finalScore');

var W = 800, H = 600;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
  var ratio = W / H;
  var ww = window.innerWidth, wh = window.innerHeight;
  var cw, ch;
  if (ww / wh > ratio) { ch = wh; cw = ch * ratio; } else { cw = ww; ch = cw / ratio; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

var gameState = 'start', score = 0, lives = 3, wave = 1;
var enemies = [], bullets = [], particles = [], powerUps = [], enemyBullets = [];
var waveTimer = 0, enemiesSpawned = 0, enemiesPerWave = 5;
var keys = {};
var mouseX = 400, mouseY = 300;
var lastTime = 0, shootCooldown = 0;
var fireRate = 150, bulletDamage = 1, bulletSpeed = 10, spreadShot = 1;
var invincibleTimer = 0;
var starField = [];
var isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// Touch controls state
var moveTouch = null, aimTouch = null;
var moveStickX = 0, moveStickY = 0;
var aimStickX = 0, aimStickY = 0;
var aimActive = false;
var moveTouchStart = {x:0, y:0};
var aimTouchStart = {x:0, y:0};
var stickRadius = 50;

for (var i = 0; i < 150; i++) {
  starField.push({x: Math.random()*W, y: Math.random()*H, size: Math.random()*2+0.5, speed: Math.random()*0.5+0.2});
}

var player = {x: 400, y: 500, w: 30, h: 30, speed: 4};

function resetGame() {
  score=0; lives=3; wave=1;
  enemies=[]; bullets=[]; particles=[]; powerUps=[]; enemyBullets=[];
  waveTimer=0; enemiesSpawned=0; enemiesPerWave=5;
  fireRate=150; bulletDamage=1; bulletSpeed=10; spreadShot=1;
  player.x=400; player.y=500;
  invincibleTimer=0;
  updateUI();
}

function updateUI() {
  scoreDisplay.textContent='SCORE: '+score;
  livesDisplay.textContent='LIVES: '+lives;
  waveDisplay.textContent='WAVE: '+wave;
}

// Keyboard input
document.addEventListener('keydown', function(e){keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup', function(e){keys[e.key.toLowerCase()]=false;});

// Mouse input
canvas.addEventListener('mousemove', function(e){
  var r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
  mouseY=(e.clientY-r.top)*(H/r.height);
});
document.addEventListener('mousedown', function(e){if(e.button===0)keys['mouse']=true;});
document.addEventListener('mouseup', function(e){if(e.button===0)keys['mouse']=false;});

// Click/tap to start
canvas.addEventListener('click', function(){
  if(gameState==='start'){gameState='playing';startScreen.style.display='none';resetGame();requestAnimationFrame(loop);}
  else if(gameState==='over'){gameState='playing';gameOverScreen.style.display='none';resetGame();}
});

// Touch input
function canvasCoords(tx, ty) {
  var r = canvas.getBoundingClientRect();
  return { x: (tx - r.left) * (W / r.width), y: (ty - r.top) * (H / r.height) };
}

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameState === 'start') { gameState='playing'; startScreen.style.display='none'; resetGame(); requestAnimationFrame(loop); return; }
  if (gameState === 'over') { gameState='playing'; gameOverScreen.style.display='none'; resetGame(); return; }
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var r = canvas.getBoundingClientRect();
    var cx = t.clientX - r.left;
    if (cx < r.width / 2) {
      moveTouch = t.identifier;
      moveTouchStart = {x: t.clientX, y: t.clientY};
      moveStickX = 0; moveStickY = 0;
    } else {
      aimTouch = t.identifier;
      aimTouchStart = {x: t.clientX, y: t.clientY};
      aimStickX = 0; aimStickY = 0;
      aimActive = true;
    }
  }
}, {passive: false});

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier === moveTouch) {
      var dx = t.clientX - moveTouchStart.x;
      var dy = t.clientY - moveTouchStart.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > stickRadius) { dx = dx/dist*stickRadius; dy = dy/dist*stickRadius; }
      moveStickX = dx / stickRadius;
      moveStickY = dy / stickRadius;
    } else if (t.identifier === aimTouch) {
      var dx2 = t.clientX - aimTouchStart.x;
      var dy2 = t.clientY - aimTouchStart.y;
      var dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);
      if (dist2 > 5) {
        aimStickX = dx2;
        aimStickY = dy2;
      }
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier === moveTouch) { moveTouch = null; moveStickX = 0; moveStickY = 0; }
    if (t.identifier === aimTouch) { aimTouch = null; aimActive = false; aimStickX = 0; aimStickY = 0; }
  }
}, {passive: false});

canvas.addEventListener('touchcancel', function(e) {
  moveTouch = null; aimTouch = null; moveStickX = 0; moveStickY = 0; aimActive = false;
}, {passive: false});

function spawnEnemy() {
  var types = wave>=5?['basic','fast','tank','shooter']:wave>=3?['basic','fast','tank']:['basic','fast'];
  var type = types[Math.floor(Math.random()*types.length)];
  var e = {x:Math.random()*740+30, y:-30, type:type};
  if(type==='basic'){e.hp=2;e.maxHp=2;e.speed=1.5;e.size=18;e.color='#f55';e.score=10;}
  else if(type==='fast'){e.hp=1;e.maxHp=1;e.speed=3;e.size=14;e.color='#ff5';e.score=15;}
  else if(type==='tank'){e.hp=5+wave;e.maxHp=e.hp;e.speed=0.8;e.size=25;e.color='#f80';e.score=30;}
  else if(type==='shooter'){e.hp=3;e.maxHp=3;e.speed=1;e.size=20;e.color='#f0f';e.score=25;e.shootTimer=0;}
  enemies.push(e);
}

function spawnPowerUp(x,y) {
  if(Math.random()>0.25)return;
  var types=['fireRate','damage','speed','spread','life'];
  var type=types[Math.floor(Math.random()*types.length)];
  var colors={fireRate:'#0ff',damage:'#f44',speed:'#4f4',spread:'#ff0',life:'#f4f'};
  powerUps.push({x:x,y:y,type:type,color:colors[type],size:10,timer:300});
}

function shoot() {
  var angle;
  if (isMobile && aimActive) {
    angle = Math.atan2(aimStickY, aimStickX);
  } else {
    angle = Math.atan2(mouseY-player.y, mouseX-player.x);
  }
  for(var i=0;i<spreadShot;i++){
    var spread=spreadShot>1?(i-(spreadShot-1)/2)*0.15:0;
    var a=angle+spread;
    bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*bulletSpeed,vy:Math.sin(a)*bulletSpeed,damage:bulletDamage});
  }
}

function spawnParticles(x,y,color,count) {
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2;
    var s=Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,color:color,size:Math.random()*3+1});
  }
}

var lastAimAngle = 0;

function update(dt) {
  if(gameState!=='playing') return;
  var dx=0, dy=0;

  // Keyboard movement
  if(keys['w']||keys['arrowup']) dy=-1;
  if(keys['s']||keys['arrowdown']) dy=1;
  if(keys['a']||keys['arrowleft']) dx=-1;
  if(keys['d']||keys['arrowright']) dx=1;

  // Touch movement
  if (moveTouch !== null) {
    dx += moveStickX;
    dy += moveStickY;
  }

  var len = Math.sqrt(dx*dx+dy*dy);
  if(len > 1) { dx/=len; dy/=len; }
  player.x = Math.max(15, Math.min(785, player.x + dx * player.speed));
  player.y = Math.max(15, Math.min(585, player.y + dy * player.speed));

  // Shooting
  shootCooldown -= dt;
  var shouldShoot = keys['mouse'] || (isMobile && aimActive && (Math.abs(aimStickX)>10 || Math.abs(aimStickY)>10));
  if(shouldShoot && shootCooldown<=0) { shoot(); shootCooldown=fireRate; }

  // Update aim angle for drawing
  if (isMobile && aimActive && (Math.abs(aimStickX)>5 || Math.abs(aimStickY)>5)) {
    lastAimAngle = Math.atan2(aimStickY, aimStickX);
    mouseX = player.x + Math.cos(lastAimAngle) * 100;
    mouseY = player.y + Math.sin(lastAimAngle) * 100;
  }

  if(invincibleTimer>0) invincibleTimer-=dt;

  bullets=bullets.filter(function(b){b.x+=b.vx;b.y+=b.vy;return b.x>-10&&b.x<810&&b.y>-10&&b.y<610;});

  enemyBullets=enemyBullets.filter(function(b){
    b.x+=b.vx;b.y+=b.vy;
    if(invincibleTimer<=0&&Math.hypot(b.x-player.x,b.y-player.y)<20){
      lives--;invincibleTimer=1500;spawnParticles(player.x,player.y,'#0ff',15);updateUI();
      if(lives<=0){gameState='over';finalScoreEl.textContent='FINAL SCORE: '+score;gameOverScreen.style.display='block';}
      return false;
    }
    return b.x>-10&&b.x<810&&b.y>-10&&b.y<610;
  });

  waveTimer-=dt;
  if(waveTimer<=0&&enemiesSpawned<enemiesPerWave){spawnEnemy();enemiesSpawned++;waveTimer=Math.max(300,800-wave*50);}
  if(enemiesSpawned>=enemiesPerWave&&enemies.length===0){wave++;enemiesPerWave=5+wave*2;enemiesSpawned=0;waveTimer=1500;updateUI();}

  enemies=enemies.filter(function(e){
    e.y+=e.speed;
    if(e.type==='fast') e.x+=Math.sin(e.y*0.05)*2;
    if(e.type==='shooter'){
      e.shootTimer=(e.shootTimer||0)+dt;
      if(e.shootTimer>1200){
        var a=Math.atan2(player.y-e.y,player.x-e.x);
        enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3});
        e.shootTimer=0;
      }
    }
    for(var i=bullets.length-1;i>=0;i--){
      if(Math.hypot(bullets[i].x-e.x,bullets[i].y-e.y)<e.size+4){
        e.hp-=bullets[i].damage;spawnParticles(bullets[i].x,bullets[i].y,e.color,5);bullets.splice(i,1);
        if(e.hp<=0){score+=e.score;spawnParticles(e.x,e.y,e.color,20);spawnPowerUp(e.x,e.y);updateUI();return false;}
        break;
      }
    }
    if(invincibleTimer<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.size+15){
      lives--;invincibleTimer=1500;spawnParticles(player.x,player.y,'#0ff',15);updateUI();
      if(lives<=0){gameState='over';finalScoreEl.textContent='FINAL SCORE: '+score;gameOverScreen.style.display='block';}
      spawnParticles(e.x,e.y,e.color,15);return false;
    }
    return e.y<640;
  });

  powerUps=powerUps.filter(function(p){
    p.timer--;
    if(Math.hypot(p.x-player.x,p.y-player.y)<p.size+15){
      if(p.type==='fireRate') fireRate=Math.max(50,fireRate-20);
      else if(p.type==='damage') bulletDamage+=0.5;
      else if(p.type==='speed'){player.speed=Math.min(7,player.speed+0.5);bulletSpeed=Math.min(16,bulletSpeed+1);}
      else if(p.type==='spread') spreadShot=Math.min(5,spreadShot+1);
      else if(p.type==='life'){lives=Math.min(5,lives+1);updateUI();}
      spawnParticles(p.x,p.y,p.color,10);return false;
    }
    return p.timer>0;
  });

  particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;p.life--;return p.life>0;});
  starField.forEach(function(s){s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
}

function drawJoystick(cx, cy, dx, dy, color) {
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, stickRadius * (W / canvas.getBoundingClientRect().width), 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = color;
  var sr = stickRadius * (W / canvas.getBoundingClientRect().width);
  ctx.beginPath();
  ctx.arc(cx + dx / stickRadius * sr, cy + dy / stickRadius * sr, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  starField.forEach(function(s){
    ctx.fillStyle='rgba(255,255,255,'+(s.size/2.5)+')';
    ctx.fillRect(s.x,s.y,s.size,s.size);
  });
  if(gameState!=='playing'&&gameState!=='over') return;

  if(invincibleTimer<=0||Math.floor(invincibleTimer/100)%2){
    var angle=Math.atan2(mouseY-player.y,mouseX-player.x);
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(angle-Math.PI/2);
    ctx.fillStyle='#0ff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-12,14);ctx.lineTo(0,8);ctx.lineTo(12,14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#0aa';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(0,255,255,'+(0.3+Math.random()*0.3)+')';ctx.beginPath();ctx.moveTo(-6,14);ctx.lineTo(0,22+Math.random()*6);ctx.lineTo(6,14);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  bullets.forEach(function(b){ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
  enemyBullets.forEach(function(b){ctx.fillStyle='#f0f';ctx.shadowColor='#f0f';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});

  enemies.forEach(function(e){
    ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=10;
    if(e.type==='tank'){ctx.fillRect(e.x-e.size,e.y-e.size,e.size*2,e.size*2);}
    else if(e.type==='shooter'){ctx.beginPath();for(var i=0;i<5;i++){var a=(i*Math.PI*2)/5-Math.PI/2;var r=i%2?e.size*0.5:e.size;ctx.lineTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);}ctx.closePath();ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(e.x,e.y-e.size);ctx.lineTo(e.x-e.size,e.y+e.size);ctx.lineTo(e.x+e.size,e.y+e.size);ctx.closePath();ctx.fill();}
    ctx.shadowBlur=0;
    if(e.hp<e.maxHp){ctx.fillStyle='#333';ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2,4);ctx.fillStyle='#0f0';ctx.fillRect(e.x-e.size,e.y-e.size-8,e.size*2*(e.hp/e.maxHp),4);}
  });

  powerUps.forEach(function(p){
    var pulse=1+Math.sin(Date.now()*0.005)*0.2;
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(p.x,p.y,p.size*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    var labels={fireRate:'F',damage:'D',speed:'S',spread:'W',life:'+'};
    ctx.fillText(labels[p.type],p.x,p.y);
  });

  particles.forEach(function(p){ctx.globalAlpha=p.life/50;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});
  ctx.globalAlpha=1;

  // Draw touch joysticks
  if (isMobile && gameState === 'playing') {
    if (moveTouch !== null) {
      var r = canvas.getBoundingClientRect();
      var mcx = (moveTouchStart.x - r.left) * (W / r.width);
      var mcy = (moveTouchStart.y - r.top) * (H / r.height);
      drawJoystick(mcx, mcy, moveStickX * stickRadius, moveStickY * stickRadius, '#0ff');
    }
    if (aimTouch !== null) {
      var r2 = canvas.getBoundingClientRect();
      var acx = (aimTouchStart.x - r2.left) * (W / r2.width);
      var acy = (aimTouchStart.y - r2.top) * (H / r2.height);
      var adx = aimStickX > stickRadius ? stickRadius : aimStickX < -stickRadius ? -stickRadius : aimStickX;
      var ady = aimStickY > stickRadius ? stickRadius : aimStickY < -stickRadius ? -stickRadius : aimStickY;
      drawJoystick(acx, acy, adx, ady, '#f55');
    }
    // Draw hint zones
    if (moveTouch === null && aimTouch === null) {
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = '#0ff';
      ctx.fillRect(0, H * 0.6, W / 2, H * 0.4);
      ctx.fillStyle = '#f55';
      ctx.fillRect(W / 2, H * 0.6, W / 2, H * 0.4);
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#0ff';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('MOVE', W * 0.25, H * 0.82);
      ctx.fillStyle = '#f55';
      ctx.fillText('AIM & FIRE', W * 0.75, H * 0.82);
      ctx.globalAlpha = 1;
    }
  }
}

function loop(time) {
  var dt = time - lastTime;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
