<style>

var renderer,scene,camera,player,clock;
var GS='start',score=0,timeLeft=90;
var tables=[],barPos={x:0,z:-7};

var joyId=null,joyCX=0,joyCY=0;
var btnId=null;
var msgTimer=0;

// Shirt and skin color palettes
var shirtColors=[0xcc3333,0x3366cc,0x33aa33,0xcc9933,0x9933cc,0xcc6699,0x339999,0xff6600,0x6633cc,0xaaaa33];
var skinColors=[0xffcc99,0xf5c08a,0xd4a574,0xc68642,0x8d5524,0xffe0bd];
var hairColors=[0x222222,0x4a2a0a,0x8a6a3a,0x111111,0x663300,0xaa8844];

function mkPerson(shirtC,skinC){
  var pg=new THREE.Group();
  var body=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.17,0.4,8),new THREE.MeshLambertMaterial({color:shirtC}));
  body.position.y=0.62;pg.add(body);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshLambertMaterial({color:skinC}));
  head.position.y=0.92;pg.add(head);
  var hair=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,4,0,Math.PI*2,0,Math.PI*0.55),new THREE.MeshLambertMaterial({color:hairColors[Math.floor(Math.random()*hairColors.length)]}));
  hair.position.y=0.94;pg.add(hair);
  for(var s=-1;s<=1;s+=2){
    var uleg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.25,6),new THREE.MeshLambertMaterial({color:0x333355}));
    uleg.rotation.x=Math.PI/2;uleg.position.set(s*0.08,0.42,0.12);pg.add(uleg);
    var lleg=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.2,6),new THREE.MeshLambertMaterial({color:0x333355}));
    lleg.position.set(s*0.08,0.25,0.23);pg.add(lleg);
    var arm=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.22,6),new THREE.MeshLambertMaterial({color:skinC}));
    arm.rotation.z=s*0.4;arm.position.set(s*0.18,0.68,0.08);pg.add(arm);
  }
  return pg;
}

function addPeopleToTable(tg){
  var seats=[{x:-0.5,z:0.8,ry:Math.PI},{x:0.5,z:0.8,ry:Math.PI},{x:-0.5,z:-0.8,ry:0},{x:0.5,z:-0.8,ry:0}];
  var count=2+Math.floor(Math.random()*3); // 2-4 people
  for(var i=0;i<Math.min(count,seats.length);i++){
    var s=seats[i];
    var sc=shirtColors[Math.floor(Math.random()*shirtColors.length)];
    var sk=skinColors[Math.floor(Math.random()*skinColors.length)];
    var p=mkPerson(sc,sk);
    p.position.set(s.x,0,s.z);p.rotation.y=s.ry;
    tg.add(p);
  }
}

var hud=document.getElementById('hud2d');
var hctx=hud.getContext('2d');

function showMsg(txt){document.getElementById('msg').textContent=txt;document.getElementById('msg').style.display='block';msgTimer=120;}

function init(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,25,55);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;
  renderer.domElement.style.cssText='display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1';
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  clock=new THREE.Clock();

  // Bright sunny lighting
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  var sun=new THREE.DirectionalLight(0xfffde8,1.0);sun.position.set(8,15,5);sun.castShadow=true;
  sun.shadow.mapSize.width=1024;sun.shadow.mapSize.height=1024;sun.shadow.camera.near=0.5;sun.shadow.camera.far=50;
  sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-15;
  scene.add(sun);
  // Warm fill light
  var fill=new THREE.DirectionalLight(0xffeedd,0.3);fill.position.set(-5,10,-5);scene.add(fill);
  // Hemisphere light for sky/ground color blending
  scene.add(new THREE.HemisphereLight(0x87CEEB,0x556B2F,0.4));
  // String lights (decorative, visible but not strong in daylight)
  var lp=[[-6,3.5,-6],[6,3.5,-6],[-6,3.5,6],[6,3.5,6],[0,3.5,0],[-3,3.5,-3],[3,3.5,-3],[-3,3.5,3],[3,3.5,3]];
  for(var i=0;i<lp.length;i++){var b=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),new THREE.MeshBasicMaterial({color:0xffeeaa}));b.position.set(lp[i][0],lp[i][1],lp[i][2]);scene.add(b);}

  // Ground - bright green grass
  var g1=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x4CAF50}));g1.rotation.x=-Math.PI/2;g1.receiveShadow=true;scene.add(g1);
  // Gravel/patio area - warm sandy color
  var g2=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({color:0xD2B48C}));g2.rotation.x=-Math.PI/2;g2.position.y=0.01;scene.add(g2);

  // Fence - warm wood
  var fm=new THREE.MeshLambertMaterial({color:0x8B6914});
  for(var x=-10;x<=10;x++){for(var s=0;s<4;s++){var p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.2,0.1),fm);if(s===0)p.position.set(x,0.6,-10);else if(s===1)p.position.set(x,0.6,10);else if(s===2)p.position.set(-10,0.6,x);else p.position.set(10,0.6,x);scene.add(p);}}
  for(var s=0;s<4;s++){var r=new THREE.Mesh(new THREE.BoxGeometry(s<2?20:0.08,0.08,s<2?0.08:20),fm);if(s===0)r.position.set(0,0.9,-10);else if(s===1)r.position.set(0,0.9,10);else if(s===2)r.position.set(-10,0.9,0);else r.position.set(10,0.9,0);scene.add(r);}

  // Bar
  var bg=new THREE.Group();
  bg.add(mb(3,1.1,1.2,0xc8a84e,0,0.55,0));bg.add(mb(3.2,0.1,1.4,0x6b4226,0,1.15,0));
  var tap=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,8),new THREE.MeshLambertMaterial({color:0xdddddd}));tap.position.set(0,1.4,0);bg.add(tap);
  bg.add(mb(0.15,0.2,0.05,0x222222,0,1.7,0));
  var sn=new THREE.Mesh(new THREE.BoxGeometry(2,0.5,0.05),new THREE.MeshBasicMaterial({color:0xffcc00}));sn.position.set(0,1.9,-0.65);bg.add(sn);
  bg.position.set(0,0,-7);scene.add(bg);

  // Trees - bright summer green
  var tm=new THREE.MeshLambertMaterial({color:0x2E8B2E}),trm=new THREE.MeshLambertMaterial({color:0x6B3A1F});
  [[-8,-8],[8,-8],[-8,8],[8,8],[-5,-9],[5,-9],[-9,0],[9,0],[-5,9],[5,9]].forEach(function(p){var t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2,8),trm);t.position.set(p[0],1,p[1]);t.castShadow=true;scene.add(t);var v=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,8),tm);v.position.set(p[0],3,p[1]);v.castShadow=true;scene.add(v);});

  // Tables
  var tbm=new THREE.MeshLambertMaterial({color:0x8B5E3C}),bnm=new THREE.MeshLambertMaterial({color:0x7A4F2E});
  [[-5,-3],[-2,-3],[2,-3],[5,-3],[-5,1],[-2,1],[2,1],[5,1],[-5,5],[-2,5],[2,5],[5,5]].forEach(function(pos){
    var tg=new THREE.Group();
    var tt=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.08,1),tbm);tt.position.y=0.75;tt.castShadow=true;tg.add(tt);
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(function(c){var lg=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.75,0.08),tbm);lg.position.set(c[0]*0.7,0.375,c[1]*0.35);tg.add(lg);});
    [-1,1].forEach(function(z){var bn=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.3),bnm);bn.position.set(0,0.45,z*0.8);tg.add(bn);});
    var ind=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,12),new THREE.MeshBasicMaterial({color:0xff3333}));ind.position.y=1.8;ind.visible=false;tg.add(ind);
    var bm=mkBeer();bm.position.set(0,0.85,0);bm.visible=false;tg.add(bm);
    addPeopleToTable(tg);
    tg.position.set(pos[0],0,pos[1]);scene.add(tg);
    tables.push({g:tg,x:pos[0],z:pos[1],need:false,has:false,ind:ind,beer:bm,cd:0});
  });

  // Player
  var pg=new THREE.Group();
  var bd=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.8,12),new THREE.MeshLambertMaterial({color:0xffffff}));bd.position.y=0.7;pg.add(bd);
  var ap=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.4,0.15),new THREE.MeshLambertMaterial({color:0x2266aa}));ap.position.set(0,0.6,0.15);pg.add(ap);
  var hd=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),new THREE.MeshLambertMaterial({color:0xffcc99}));hd.position.y=1.25;pg.add(hd);
  [-1,1].forEach(function(s){var lg=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.4,8),new THREE.MeshLambertMaterial({color:0x333333}));lg.position.set(s*0.12,0.2,0);pg.add(lg);});
  var hb=mkBeer();hb.position.set(0.35,0.9,0.2);hb.visible=false;hb.name='hb';pg.add(hb);
  scene.add(pg);player=pg;

  // Sun sphere in sky
  var sunSphere=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16),new THREE.MeshBasicMaterial({color:0xFFFF88}));
  sunSphere.position.set(15,25,10);scene.add(sunSphere);
  // Clouds
  var cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.85});
  [[-12,18,-15],[8,16,-20],[20,17,-10],[-5,19,-25],[15,20,-18]].forEach(function(cp){
    var cg=new THREE.Group();
    for(var ci=0;ci<4;ci++){var cs=new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*1.5,8,8),cloudMat);cs.position.set(ci*1.2-1.5,Math.random()*0.5,Math.random()*0.8);cs.scale.y=0.5;cg.add(cs);}
    cg.position.set(cp[0],cp[1],cp[2]);scene.add(cg);
  });

  camera.position.set(0,8,8);
  window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

  // Input
  document.addEventListener('touchstart',onTS,{passive:false});
  document.addEventListener('touchmove',onTM,{passive:false});
  document.addEventListener('touchend',onTE,{passive:false});
  document.addEventListener('touchcancel',onTC,{passive:false});
  document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
  document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  document.addEventListener('click',function(){if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();}});

  animate();
}

function mb(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;return m;}
function mkBeer(){var g=new THREE.Group();var gl=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.09,0.35,8),new THREE.MeshLambertMaterial({color:0xddaa22,transparent:true,opacity:0.8}));gl.position.y=0.175;g.add(gl);var fo=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.08,8),new THREE.MeshLambertMaterial({color:0xffffff}));fo.position.y=0.38;g.add(fo);return g;}

// Collision detection
function collides(px,pz){
  // Tables (box collision with padding)
  for(var i=0;i<tables.length;i++){
    var t=tables[i];
    var dx=Math.abs(px-t.x);
    var dz=Math.abs(pz-t.z);
    if(dx<1.3&&dz<1.1) return true;
  }
  // Bar
  var bdx=Math.abs(px-barPos.x);
  var bdz=Math.abs(pz-barPos.z);
  if(bdx<1.8&&bdz<0.9) return true;
  // Fence
  if(Math.abs(px)>9.3||Math.abs(pz)>9.3) return true;
  return false;
}

// Button: bottom right, BIG
function btnRect(){var s=Math.max(70,Math.min(window.innerWidth,window.innerHeight)*0.18);var m=15;return{x:window.innerWidth-s-m,y:window.innerHeight-s-m,r:s/2};}

function onTS(e){
  e.preventDefault();
  if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();return;}
  if(GS!=='playing')return;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var br=btnRect();
    var bx=t.clientX-(br.x+br.r),by=t.clientY-(br.y+br.r);
    // Big hit area for button
    if(bx*bx+by*by<(br.r+20)*(br.r+20)){
      btnId=t.identifier;doAction();
    }else if(t.clientX<window.innerWidth*0.6&&joyId===null){
      joyId=t.identifier;joyCX=t.clientX;joyCY=t.clientY;jDX=0;jDZ=0;
    }
  }
}
function onTM(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyId){
      var dx=t.clientX-joyCX,dy=t.clientY-joyCY;
      var dist=Math.sqrt(dx*dx+dy*dy),maxR=60;
      if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
      jDX=dx/maxR;jDZ=dy/maxR;
    }
  }
}
function onTE(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joyId){joyId=null;jDX=0;jDZ=0;}if(t.identifier===btnId)btnId=null;}}
function onTC(){joyId=null;btnId=null;jDX=0;jDZ=0;}

function doAction(){
  if(GS!=='playing')return;
  var px=player.position.x,pz=player.position.z;
  if(!carrying){
    // Pick up beer from bar - generous range
    var db=Math.sqrt((px-barPos.x)*(px-barPos.x)+(pz-barPos.z)*(pz-barPos.z));
    if(db<3.5){
      carrying=true;document.getElementById('cr').textContent=t.carrying;document.getElementById('cr').style.display='block';player.getObjectByName('hb').visible=true;
      showMsg(t.gotBeer);
    }else{
      showMsg(t.goBar);
    }
  }else{
    // Deliver beer to table - check all needing tables
    var delivered=false;
    for(var i=0;i<tables.length;i++){
      var tb=tables[i];if(!tb.need)continue;
      var d=Math.sqrt((px-tb.x)*(px-tb.x)+(pz-tb.z)*(pz-tb.z));
      if(d<3){
        tb.need=false;tb.has=true;tb.ind.visible=false;tb.beer.visible=true;tb.cd=300;
        carrying=false;document.getElementById('cr').style.display='none';player.getObjectByName('hb').visible=false;
        score++;updUI();
        tb.ind.material.color.setHex(0x33ff33);tb.ind.visible=true;
        setTimeout((function(t){return function(){t.ind.visible=false;};})(tb),500);
        showMsg(t.plusOne);
        delivered=true;break;
      }
    }
    if(!delivered) showMsg(t.goTable);
  }
}

function startGame(){
  score=0;timeLeft=90;carrying=false;
  document.getElementById('cr').style.display='none';document.getElementById('msg').style.display='none';
  player.getObjectByName('hb').visible=false;player.position.set(0,0,3);
  for(var i=0;i<tables.length;i++){tables[i].need=false;tables[i].has=false;tables[i].ind.visible=false;tables[i].beer.visible=false;tables[i].cd=0;}
  updUI();setN();setN();setN();
  if(timerI)clearInterval(timerI);
  timerI=setInterval(function(){if(GS!=='playing')return;timeLeft--;document.getElementById('tm').textContent=t.time+': '+timeLeft;if(timeLeft<=0)endG();},1000);
  if(needI)clearInterval(needI);
  needI=setInterval(function(){if(GS!=='playing')return;setN();},4000);
}

function setN(){var a=[];for(var i=0;i<tables.length;i++){if(!tables[i].need&&!tables[i].has)a.push(i);}if(!a.length)return;var idx=a[Math.floor(Math.random()*a.length)];tables[idx].need=true;tables[idx].ind.visible=true;tables[idx].ind.material.color.setHex(0xff3333);}
function endG(){GS='over';if(timerI)clearInterval(timerI);if(needI)clearInterval(needI);var ov=document.getElementById('ov');ov.querySelector('h1').textContent=t.end;ov.querySelector('h2').textContent=t.endScore(score);ov.style.display='flex';}
function updUI(){document.getElementById('sc').textContent=t.score+': '+score;document.getElementById('tm').textContent=t.time+': '+timeLeft;}

function drawHud(){
  hctx.clearRect(0,0,hud.width,hud.height);
  if(GS!=='playing')return;
  if(!isMob)return;
  // Joystick
  var jx,jy;
  if(joyId!==null){jx=joyCX;jy=joyCY;}else{jx=70;jy=hud.height-70;}
  hctx.globalAlpha=0.2;hctx.strokeStyle='#0ff';hctx.lineWidth=3;
  hctx.beginPath();hctx.arc(jx,jy,55,0,Math.PI*2);hctx.stroke();
  hctx.globalAlpha=0.5;hctx.fillStyle='#0ff';
  hctx.beginPath();hctx.arc(jx+jDX*45,jy+jDZ*45,18,0,Math.PI*2);hctx.fill();
  if(joyId===null){hctx.globalAlpha=0.4;hctx.fillStyle='#0ff';hctx.font='11px Courier New';hctx.textAlign='center';hctx.fillText(t.move,jx,jy+4);}
  // Action button - BIG
  var br=btnRect();
  var bcx=br.x+br.r,bcy=br.y+br.r;
  hctx.globalAlpha=0.4;hctx.fillStyle=carrying?'#4a4':'#fa0';
  hctx.beginPath();hctx.arc(bcx,bcy,br.r,0,Math.PI*2);hctx.fill();
  hctx.globalAlpha=1;hctx.strokeStyle=carrying?'#4f4':'#fc0';hctx.lineWidth=4;
  hctx.beginPath();hctx.arc(bcx,bcy,br.r,0,Math.PI*2);hctx.stroke();
  hctx.fillStyle='#fff';hctx.font='bold '+Math.max(14,Math.round(br.r*0.35))+'px Courier New';hctx.textAlign='center';hctx.textBaseline='middle';
  hctx.fillText(carrying?t.putdown:t.pickup,bcx,bcy);
  // Proximity hint
  var px=player.position.x,pz=player.position.z;
  var nearBar=Math.sqrt((px-barPos.x)*(px-barPos.x)+(pz-barPos.z)*(pz-barPos.z))<3.5;
  var nearTable=false;
  for(var i=0;i<tables.length;i++){if(tables[i].need&&Math.sqrt((px-tables[i].x)*(px-tables[i].x)+(pz-tables[i].z)*(pz-tables[i].z))<3)nearTable=true;}
  if(!carrying&&nearBar){
    hctx.globalAlpha=0.8;hctx.fillStyle='#ff0';hctx.font='bold 16px Courier New';hctx.textAlign='center';
    hctx.fillText(t.hintPickup,hud.width/2,hud.height/2);
  }else if(carrying&&nearTable){
    hctx.globalAlpha=0.8;hctx.fillStyle='#4f4';hctx.font='bold 16px Courier New';hctx.textAlign='center';
    hctx.fillText(t.hintDrop,hud.width/2,hud.height/2);
  }
  hctx.globalAlpha=1;
}

function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta();
  if(GS==='playing'){
    var dx=0,dz=0;
    if(keys['w']||keys['arrowup'])dz=-1;if(keys['s']||keys['arrowdown'])dz=1;
    if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;
    dx+=jDX;dz+=jDZ;
    var len=Math.sqrt(dx*dx+dz*dz);if(len>1){dx/=len;dz/=len;}
    if(keys[' ']){keys[' ']=false;doAction();}
    // Move with collision
    var spd=5*dt;
    var nx=player.position.x+dx*spd;
    var nz=player.position.z+dz*spd;
    // Try X, then Z separately for sliding along walls
    if(!collides(nx,player.position.z)) player.position.x=nx;
    if(!collides(player.position.x,nz)) player.position.z=nz;
    if(len>0.1){pAngle=Math.atan2(dx,dz);player.rotation.y=pAngle;}
    // Animate indicators
    var t=Date.now()*0.003;
    for(var i=0;i<tables.length;i++){if(tables[i].need){tables[i].ind.position.y=1.8+Math.sin(t+i)*0.3;tables[i].ind.scale.setScalar(0.8+Math.sin(t*2+i)*0.3);}if(tables[i].has){tables[i].cd--;if(tables[i].cd<=0){tables[i].has=false;tables[i].beer.visible=false;}}}
    // Camera
    camera.position.x+=(player.position.x-camera.position.x)*2*dt;
    camera.position.z+=(player.position.z+8-camera.position.z)*2*dt;
    camera.lookAt(player.position.x,0,player.position.z);
    // Message timer
    if(msgTimer>0){msgTimer--;if(msgTimer<=0)document.getElementById('msg').style.display='none';}
  }
  renderer.render(scene,camera);
  drawHud();
}

init();
</script>
