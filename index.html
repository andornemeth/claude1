<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { display: block; border: 1px solid #333; }
#ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #0ff; font-size: 18px; text-align: center; pointer-events: none; z-index: 10; }
#startScreen, #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0ff; text-align: center; z-index: 20; }
#startScreen h1 { font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px #0ff; }
#startScreen p, #gameOver p { font-size: 18px; margin: 10px 0; }
#gameOver h2 { font-size: 36px; margin-bottom: 10px; color: #f44; text-shadow: 0 0 20px #f44; }
#gameOver { display: none; }
.blink { animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<div id="ui">
  <span id="scoreDisplay">SCORE: 0</span> &nbsp;&nbsp;
  <span id="livesDisplay">LIVES: 3</span> &nbsp;&nbsp;
  <span id="waveDisplay">WAVE: 1</span>
</div>
<div id="startScreen">
  <h1>SPACE SHOOTER</h1>
  <p>WASD or Arrow Keys to move</p>
  <p>Mouse to aim &amp; Left Click to shoot</p>
  <p>Collect power-ups for upgrades!</p>
  <p class="blink" style="margin-top:30px; font-size:22px;">CLICK TO START</p>
</div>
<div id="gameOver">
  <h2>GAME OVER</h2>
  <p id="finalScore"></p>
  <p class="blink" style="margin-top:20px;">CLICK TO RESTART</p>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOver');
const scoreDisplay = document.getElementById('scoreDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const finalScore = document.getElementById('finalScore');

canvas.width = 800;
canvas.height = 600;

let gameState = 'start';
let score = 0, lives = 3, wave = 1;
let enemies = [], bullets = [], particles = [], powerUps = [], enemyBullets = [];
let waveTimer = 0, enemiesSpawned = 0, enemiesPerWave = 5;
let keys = {};
let mouseX = 400, mouseY = 300;
let lastTime = 0, shootCooldown = 0;
let fireRate = 150, bulletDamage = 1, bulletSpeed = 10, spreadShot = 1;
let invincibleTimer = 0;
let starField = [];

for (let i = 0; i < 150; i++) {
  starField.push({ x: Math.random() * 800, y: Math.random() * 600, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.5 + 0.2 });
}

const player = { x: 400, y: 500, w: 30, h: 30, speed: 4 };

function resetGame() {
  score = 0; lives = 3; wave = 1;
  enemies = []; bullets = []; particles = []; powerUps = []; enemyBullets = [];
  waveTimer = 0; enemiesSpawned = 0; enemiesPerWave = 5;
  fireRate = 150; bulletDamage = 1; bulletSpeed = 10; spreadShot = 1;
  player.x = 400; player.y = 500;
  invincibleTimer = 0;
  updateUI();
}

function updateUI() {
  scoreDisplay.textContent = 'SCORE: ' + score;
  livesDisplay.textContent = 'LIVES: ' + lives;
  waveDisplay.textContent = 'WAVE: ' + wave;
}

document.addEventListener('keydown', function(e) { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', function(e) {
  var r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
canvas.addEventListener('click', function() {
  if (gameState === 'start') { gameState = 'playing'; startScreen.style.display = 'none'; resetGame(); requestAnimationFrame(loop); }
  else if (gameState === 'over') { gameState = 'playing'; gameOverScreen.style.display = 'none'; resetGame(); }
});
document.addEventListener('mousedown', function(e) { if (e.button === 0) keys['mouse'] = true; });
document.addEventListener('mouseup', function(e) { if (e.button === 0) keys['mouse'] = false; });

function spawnEnemy() {
  var types = wave >= 5 ? ['basic','fast','tank','shooter'] : wave >= 3 ? ['basic','fast','tank'] : ['basic','fast'];
  var type = types[Math.floor(Math.random() * types.length)];
  var e = { x: Math.random() * 740 + 30, y: -30, type: type };
  if (type === 'basic') { e.hp = 2; e.maxHp = 2; e.speed = 1.5; e.size = 18; e.color = '#f55'; e.score = 10; }
  else if (type === 'fast') { e.hp = 1; e.maxHp = 1; e.speed = 3; e.size = 14; e.color = '#ff5'; e.score = 15; }
  else if (type === 'tank') { e.hp = 5 + wave; e.maxHp = e.hp; e.speed = 0.8; e.size = 25; e.color = '#f80'; e.score = 30; }
  else if (type === 'shooter') { e.hp = 3; e.maxHp = 3; e.speed = 1; e.size = 20; e.color = '#f0f'; e.score = 25; e.shootTimer = 0; }
  enemies.push(e);
}

function spawnPowerUp(x, y) {
  if (Math.random() > 0.25) return;
  var types = ['fireRate','damage','speed','spread','life'];
  var type = types[Math.floor(Math.random() * types.length)];
  var colors = { fireRate: '#0ff', damage: '#f44', speed: '#4f4', spread: '#ff0', life: '#f4f' };
  powerUps.push({ x: x, y: y, type: type, color: colors[type], size: 10, timer: 300 });
}

function shoot() {
  var angle = Math.atan2(mouseY - player.y, mouseX - player.x);
  for (var i = 0; i < spreadShot; i++) {
    var spread = spreadShot > 1 ? (i - (spreadShot - 1) / 2) * 0.15 : 0;
    var a = angle + spread;
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * bulletSpeed, vy: Math.sin(a) * bulletSpeed, damage: bulletDamage });
  }
}

function spawnParticles(x, y, color, count) {
  for (var i = 0; i < count; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = Math.random() * 3 + 1;
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 20, color: color, size: Math.random() * 3 + 1 });
  }
}

function update(dt) {
  if (gameState !== 'playing') return;
  var dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -1;
  if (keys['s'] || keys['arrowdown']) dy = 1;
  if (keys['a'] || keys['arrowleft']) dx = -1;
  if (keys['d'] || keys['arrowright']) dx = 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  player.x = Math.max(15, Math.min(785, player.x + dx * player.speed));
  player.y = Math.max(15, Math.min(585, player.y + dy * player.speed));

  shootCooldown -= dt;
  if (keys['mouse'] && shootCooldown <= 0) { shoot(); shootCooldown = fireRate; }
  if (invincibleTimer > 0) invincibleTimer -= dt;

  bullets = bullets.filter(function(b) {
    b.x += b.vx; b.y += b.vy;
    return b.x > -10 && b.x < 810 && b.y > -10 && b.y < 610;
  });

  enemyBullets = enemyBullets.filter(function(b) {
    b.x += b.vx; b.y += b.vy;
    if (invincibleTimer <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < 20) {
      lives--;
      invincibleTimer = 1500;
      spawnParticles(player.x, player.y, '#0ff', 15);
      updateUI();
      if (lives <= 0) { gameState = 'over'; finalScore.textContent = 'FINAL SCORE: ' + score; gameOverScreen.style.display = 'block'; }
      return false;
    }
    return b.x > -10 && b.x < 810 && b.y > -10 && b.y < 610;
  });

  waveTimer -= dt;
  if (waveTimer <= 0 && enemiesSpawned < enemiesPerWave) {
    spawnEnemy();
    enemiesSpawned++;
    waveTimer = Math.max(300, 800 - wave * 50);
  }
  if (enemiesSpawned >= enemiesPerWave && enemies.length === 0) {
    wave++;
    enemiesPerWave = 5 + wave * 2;
    enemiesSpawned = 0;
    waveTimer = 1500;
    updateUI();
  }

  enemies = enemies.filter(function(e) {
    e.y += e.speed;
    if (e.type === 'fast') e.x += Math.sin(e.y * 0.05) * 2;
    if (e.type === 'shooter') {
      e.shootTimer = (e.shootTimer || 0) + dt;
      if (e.shootTimer > 1200) {
        var a = Math.atan2(player.y - e.y, player.x - e.x);
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 });
        e.shootTimer = 0;
      }
    }
    for (var i = bullets.length - 1; i >= 0; i--) {
      if (Math.hypot(bullets[i].x - e.x, bullets[i].y - e.y) < e.size + 4) {
        e.hp -= bullets[i].damage;
        spawnParticles(bullets[i].x, bullets[i].y, e.color, 5);
        bullets.splice(i, 1);
        if (e.hp <= 0) {
          score += e.score;
          spawnParticles(e.x, e.y, e.color, 20);
          spawnPowerUp(e.x, e.y);
          updateUI();
          return false;
        }
        break;
      }
    }
    if (invincibleTimer <= 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.size + 15) {
      lives--;
      invincibleTimer = 1500;
      spawnParticles(player.x, player.y, '#0ff', 15);
      updateUI();
      if (lives <= 0) { gameState = 'over'; finalScore.textContent = 'FINAL SCORE: ' + score; gameOverScreen.style.display = 'block'; }
      spawnParticles(e.x, e.y, e.color, 15);
      return false;
    }
    return e.y < 640;
  });

  powerUps = powerUps.filter(function(p) {
    p.timer--;
    if (Math.hypot(p.x - player.x, p.y - player.y) < p.size + 15) {
      if (p.type === 'fireRate') fireRate = Math.max(50, fireRate - 20);
      else if (p.type === 'damage') bulletDamage += 0.5;
      else if (p.type === 'speed') { player.speed = Math.min(7, player.speed + 0.5); bulletSpeed = Math.min(16, bulletSpeed + 1); }
      else if (p.type === 'spread') spreadShot = Math.min(5, spreadShot + 1);
      else if (p.type === 'life') { lives = Math.min(5, lives + 1); updateUI(); }
      spawnParticles(p.x, p.y, p.color, 10);
      return false;
    }
    return p.timer > 0;
  });

  particles = particles.filter(function(p) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life--;
    return p.life > 0;
  });

  starField.forEach(function(s) { s.y += s.speed; if (s.y > 600) { s.y = 0; s.x = Math.random() * 800; } });
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 800, 600);
  starField.forEach(function(s) {
    ctx.fillStyle = 'rgba(255,255,255,' + (s.size / 2.5) + ')';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  if (gameState !== 'playing' && gameState !== 'over') return;

  if (invincibleTimer <= 0 || Math.floor(invincibleTimer / 100) % 2) {
    var angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle - Math.PI / 2);
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 14);
    ctx.lineTo(0, 8);
    ctx.lineTo(12, 14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#0aa';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,255,' + (0.3 + Math.random() * 0.3) + ')';
    ctx.beginPath();
    ctx.moveTo(-6, 14);
    ctx.lineTo(0, 22 + Math.random() * 6);
    ctx.lineTo(6, 14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  bullets.forEach(function(b) {
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  enemyBullets.forEach(function(b) {
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  enemies.forEach(function(e) {
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 10;
    if (e.type === 'tank') {
      ctx.fillRect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
    } else if (e.type === 'shooter') {
      ctx.beginPath();
      for (var i = 0; i < 5; i++) {
        var a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        var r = i % 2 ? e.size * 0.5 : e.size;
        ctx.lineTo(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - e.size);
      ctx.lineTo(e.x - e.size, e.y + e.size);
      ctx.lineTo(e.x + e.size, e.y + e.size);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    if (e.hp < e.maxHp) {
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - e.size, e.y - e.size - 8, e.size * 2, 4);
      ctx.fillStyle = '#0f0';
      ctx.fillRect(e.x - e.size, e.y - e.size - 8, e.size * 2 * (e.hp / e.maxHp), 4);
    }
  });

  powerUps.forEach(function(p) {
    var pulse = 1 + Math.sin(Date.now() * 0.005) * 0.2;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var labels = { fireRate: 'F', damage: 'D', speed: 'S', spread: 'W', life: '+' };
    ctx.fillText(labels[p.type], p.x, p.y);
  });

  particles.forEach(function(p) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function loop(time) {
  var dt = time - lastTime;
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
