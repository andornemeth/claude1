<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorkert Szimulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.hud{position:fixed;pointer-events:none;z-index:10;color:#ff0;font-size:16px;text-shadow:2px 2px 4px #000}
#sc{top:8px;left:50%;transform:translateX(-50%)}
#tm{top:8px;right:12px;color:#f55;font-size:18px}
#cr{top:32px;left:50%;transform:translateX(-50%);color:#fa0;font-size:14px;display:none}
#ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;color:#fa0;text-align:center;padding:20px}
#ov h1{font-size:28px;margin-bottom:8px;text-shadow:0 0 20px #fa0}
#ov h2{font-size:16px;color:#fc0;margin-bottom:15px}
#ov p{font-size:13px;margin:4px 0;color:#ddd}
.bl{animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.3}}
#hud2d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="sc" class="hud">PONT: 0</div>
<div id="tm" class="hud">IDO: 90</div>
<div id="cr" class="hud">SORT VISZEL!</div>
<div id="ov">
  <h1>SORKERT SZIMULATOR</h1>
  <h2>Szolgald ki a vendegeket!</h2>
  <p>Menj a CSAPHOZ (sarga pult) sorert</p>
  <p>Vidd a PIROS jelzesu asztalokhoz</p>
  <p>90 masodperced van!</p>
  <p style="margin-top:8px;color:#aaa">Mobil: Bal ujj mozog, Jobb ujj gomb</p>
  <p style="color:#aaa">PC: WASD + SPACE</p>
  <p class="bl" style="margin-top:20px;font-size:18px;color:#ff0">KOPPINTS AZ INDITASHOZ</p>
</div>
<canvas id="hud2d"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var renderer,scene,camera,player,clock;
var GS='start',score=0,timeLeft=90;
var tables=[],barPos={x:0,z:-7};
var carrying=false,keys={},pAngle=0;
var isMob='ontouchstart'in window||navigator.maxTouchPoints>0;
var jDX=0,jDZ=0;
var timerI=null,needI=null;

// Touch state
var touches={};
var joyId=null,joyCX=0,joyCY=0;
var btnId=null;

// HUD canvas for drawing mobile controls
var hud=document.getElementById('hud2d');
var hctx=hud.getContext('2d');

function resizeHud(){hud.width=window.innerWidth;hud.height=window.innerHeight;}
resizeHud();
window.addEventListener('resize',resizeHud);

function init(){
  // Three.js setup
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0a2e);
  scene.fog=new THREE.Fog(0x0a0a2e,20,45);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.domElement.style.cssText='display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1';
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  clock=new THREE.Clock();

  // Lights
  scene.add(new THREE.AmbientLight(0x334455,0.6));
  var mn=new THREE.DirectionalLight(0x8899bb,0.4);mn.position.set(10,20,5);mn.castShadow=true;scene.add(mn);
  var lp=[[-6,4,-6],[6,4,-6],[-6,4,6],[6,4,6],[0,4,0],[-3,4,-3],[3,4,-3],[-3,4,3],[3,4,3],[0,4,-8],[0,4,8],[-8,4,0],[8,4,0]];
  for(var i=0;i<lp.length;i++){var l=new THREE.PointLight(0xffaa44,0.5,12);l.position.set(lp[i][0],lp[i][1],lp[i][2]);scene.add(l);var b=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),new THREE.MeshBasicMaterial({color:0xffdd66}));b.position.copy(l.position);scene.add(b);}

  // Ground
  var g1=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x2d5a1e}));g1.rotation.x=-Math.PI/2;g1.receiveShadow=true;scene.add(g1);
  var g2=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({color:0x8a7a5a}));g2.rotation.x=-Math.PI/2;g2.position.y=0.01;scene.add(g2);

  // Fence
  var fm=new THREE.MeshLambertMaterial({color:0x5c3a1e});
  for(var x=-10;x<=10;x++){for(var s=0;s<4;s++){var p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.2,0.1),fm);if(s===0)p.position.set(x,0.6,-10);else if(s===1)p.position.set(x,0.6,10);else if(s===2)p.position.set(-10,0.6,x);else p.position.set(10,0.6,x);scene.add(p);}}
  for(var s=0;s<4;s++){var r=new THREE.Mesh(new THREE.BoxGeometry(s<2?20:0.08,0.08,s<2?0.08:20),fm);if(s===0)r.position.set(0,0.9,-10);else if(s===1)r.position.set(0,0.9,10);else if(s===2)r.position.set(-10,0.9,0);else r.position.set(10,0.9,0);scene.add(r);}

  // Bar
  var bg=new THREE.Group();
  bg.add(mb(3,1.1,1.2,0xc8a84e,0,0.55,0));bg.add(mb(3.2,0.1,1.4,0x6b4226,0,1.15,0));
  var tp=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.5,8),new THREE.MeshLambertMaterial({color:0xdddddd}));tp.position.set(0,1.4,0);bg.add(tp);
  bg.add(mb(0.15,0.2,0.05,0x222222,0,1.7,0));
  var sn=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.4,0.05),new THREE.MeshBasicMaterial({color:0xffcc00}));sn.position.set(0,1.9,-0.6);bg.add(sn);
  bg.position.set(0,0,-7);scene.add(bg);
  var bl=new THREE.PointLight(0xffcc44,1,6);bl.position.set(0,2,-7);scene.add(bl);

  // Trees
  var tm=new THREE.MeshLambertMaterial({color:0x1a4a0a}),trm=new THREE.MeshLambertMaterial({color:0x4a2a0a});
  [[-8,-8],[8,-8],[-8,8],[8,8],[-5,-9],[5,-9],[-9,0],[9,0],[-5,9],[5,9]].forEach(function(p){var t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,2,8),trm);t.position.set(p[0],1,p[1]);t.castShadow=true;scene.add(t);var v=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,8),tm);v.position.set(p[0],3,p[1]);v.castShadow=true;scene.add(v);});

  // Tables
  var tbm=new THREE.MeshLambertMaterial({color:0x6b4226}),bnm=new THREE.MeshLambertMaterial({color:0x5a3a1a});
  [[-5,-3],[-2,-3],[2,-3],[5,-3],[-5,1],[-2,1],[2,1],[5,1],[-5,5],[-2,5],[2,5],[5,5]].forEach(function(pos){
    var tg=new THREE.Group();
    var tt=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.08,1),tbm);tt.position.y=0.75;tt.castShadow=true;tg.add(tt);
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(function(c){var lg=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.75,0.08),tbm);lg.position.set(c[0]*0.7,0.375,c[1]*0.35);tg.add(lg);});
    [-1,1].forEach(function(z){var bn=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.3),bnm);bn.position.set(0,0.45,z*0.8);tg.add(bn);});
    var ind=new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),new THREE.MeshBasicMaterial({color:0xff3333}));ind.position.y=1.5;ind.visible=false;tg.add(ind);
    var bm=mkB();bm.position.set(0,0.85,0);bm.visible=false;tg.add(bm);
    tg.position.set(pos[0],0,pos[1]);scene.add(tg);
    tables.push({g:tg,x:pos[0],z:pos[1],need:false,has:false,ind:ind,beer:bm,cd:0});
  });

  // Player
  var pg=new THREE.Group();
  var bd=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.8,12),new THREE.MeshLambertMaterial({color:0xffffff}));bd.position.y=0.7;pg.add(bd);
  var ap=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.4,0.15),new THREE.MeshLambertMaterial({color:0x2266aa}));ap.position.set(0,0.6,0.15);pg.add(ap);
  var hd=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),new THREE.MeshLambertMaterial({color:0xffcc99}));hd.position.y=1.25;pg.add(hd);
  [-1,1].forEach(function(s){var lg=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.4,8),new THREE.MeshLambertMaterial({color:0x333333}));lg.position.set(s*0.12,0.2,0);pg.add(lg);});
  var hb=mkB();hb.position.set(0.35,0.9,0.2);hb.visible=false;hb.name='hb';pg.add(hb);
  scene.add(pg);player=pg;

  camera.position.set(0,8,8);
  window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

  // ALL touch input on document
  document.addEventListener('touchstart',onTS,{passive:false});
  document.addEventListener('touchmove',onTM,{passive:false});
  document.addEventListener('touchend',onTE,{passive:false});
  document.addEventListener('touchcancel',onTC,{passive:false});
  document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
  document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
  document.addEventListener('click',function(){if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();}});

  animate();
}

function mb(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;return m;}
function mkB(){var g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.3,8),new THREE.MeshLambertMaterial({color:0xddaa22,transparent:true,opacity:0.8})));g.children[0].position.y=0.15;var f=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.06,8),new THREE.MeshLambertMaterial({color:0xffffff}));f.position.y=0.32;g.add(f);return g;}

// Button position (bottom right)
function btnRect(){var s=Math.min(window.innerWidth,window.innerHeight)*0.15;var m=20;return{x:window.innerWidth-s-m,y:window.innerHeight-s-m,w:s,h:s,r:s/2};}
// Joy area (bottom left half)
function isLeftHalf(x){return x<window.innerWidth/2;}

function onTS(e){
  e.preventDefault();
  if(GS==='start'||GS==='over'){GS='playing';document.getElementById('ov').style.display='none';startGame();return;}
  if(GS!=='playing')return;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var br=btnRect();
    var bx=t.clientX-(br.x+br.r),by=t.clientY-(br.y+br.r);
    // Check if touching the action button area
    if(bx*bx+by*by<br.r*br.r){
      btnId=t.identifier;
      doAction();
    }else if(isLeftHalf(t.clientX)&&joyId===null){
      // Joystick
      joyId=t.identifier;
      joyCX=t.clientX;joyCY=t.clientY;
      jDX=0;jDZ=0;
    }
  }
}

function onTM(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyId){
      var dx=t.clientX-joyCX,dy=t.clientY-joyCY;
      var dist=Math.sqrt(dx*dx+dy*dy),maxR=60;
      if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
      jDX=dx/maxR;jDZ=dy/maxR;
    }
  }
}

function onTE(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===joyId){joyId=null;jDX=0;jDZ=0;}
    if(t.identifier===btnId){btnId=null;}
  }
}

function onTC(){joyId=null;btnId=null;jDX=0;jDZ=0;}

function doAction(){
  if(GS!=='playing')return;
  var px=player.position.x,pz=player.position.z;
  if(!carrying){
    if(Math.sqrt((px-barPos.x)*(px-barPos.x)+(pz-barPos.z)*(pz-barPos.z))<2.5){
      carrying=true;document.getElementById('cr').style.display='block';player.getObjectByName('hb').visible=true;
    }
  }else{
    for(var i=0;i<tables.length;i++){
      var tb=tables[i];if(!tb.need)continue;
      if(Math.sqrt((px-tb.x)*(px-tb.x)+(pz-tb.z)*(pz-tb.z))<2.2){
        tb.need=false;tb.has=true;tb.ind.visible=false;tb.beer.visible=true;tb.cd=300;
        carrying=false;document.getElementById('cr').style.display='none';player.getObjectByName('hb').visible=false;
        score++;updUI();
        tb.ind.material.color.setHex(0x33ff33);tb.ind.visible=true;
        setTimeout((function(t){return function(){t.ind.visible=false;};})(tb),500);
        break;
      }
    }
  }
}

function startGame(){
  score=0;timeLeft=90;carrying=false;
  document.getElementById('cr').style.display='none';
  player.getObjectByName('hb').visible=false;
  player.position.set(0,0,0);
  for(var i=0;i<tables.length;i++){tables[i].need=false;tables[i].has=false;tables[i].ind.visible=false;tables[i].beer.visible=false;tables[i].cd=0;}
  updUI();setN();setN();
  if(timerI)clearInterval(timerI);
  timerI=setInterval(function(){if(GS!=='playing')return;timeLeft--;document.getElementById('tm').textContent='IDO: '+timeLeft;if(timeLeft<=0)endG();},1000);
  if(needI)clearInterval(needI);
  needI=setInterval(function(){if(GS!=='playing')return;setN();},4000);
}

function setN(){var a=[];for(var i=0;i<tables.length;i++){if(!tables[i].need&&!tables[i].has)a.push(i);}if(!a.length)return;var idx=a[Math.floor(Math.random()*a.length)];tables[idx].need=true;tables[idx].ind.visible=true;tables[idx].ind.material.color.setHex(0xff3333);}
function endG(){GS='over';if(timerI)clearInterval(timerI);if(needI)clearInterval(needI);var ov=document.getElementById('ov');ov.querySelector('h1').textContent='VEGE!';ov.querySelector('h2').textContent='Kiszolgaltal '+score+' sort!';ov.style.display='flex';}
function updUI(){document.getElementById('sc').textContent='PONT: '+score;document.getElementById('tm').textContent='IDO: '+timeLeft;}

function drawHud(){
  hctx.clearRect(0,0,hud.width,hud.height);
  if(GS!=='playing'||!isMob)return;
  // Draw joystick
  var jx,jy;
  if(joyId!==null){jx=joyCX;jy=joyCY;}else{jx=80;jy=hud.height-80;}
  hctx.globalAlpha=0.25;
  hctx.strokeStyle='#0ff';hctx.lineWidth=3;
  hctx.beginPath();hctx.arc(jx,jy,60,0,Math.PI*2);hctx.stroke();
  hctx.globalAlpha=0.4;
  hctx.fillStyle='#0ff';
  hctx.beginPath();hctx.arc(jx+jDX*50,jy+jDZ*50,20,0,Math.PI*2);hctx.fill();
  // Draw action button
  var br=btnRect();
  hctx.globalAlpha=0.35;
  hctx.fillStyle=carrying?'#4a4':'#fa0';
  hctx.beginPath();hctx.arc(br.x+br.r,br.y+br.r,br.r,0,Math.PI*2);hctx.fill();
  hctx.globalAlpha=0.9;
  hctx.strokeStyle=carrying?'#4f4':'#fc0';
  hctx.lineWidth=3;
  hctx.beginPath();hctx.arc(br.x+br.r,br.y+br.r,br.r,0,Math.PI*2);hctx.stroke();
  hctx.fillStyle='#fff';hctx.font='bold '+Math.round(br.r*0.4)+'px Courier New';hctx.textAlign='center';hctx.textBaseline='middle';
  hctx.fillText(carrying?'LETESZ':'FELVSZ',br.x+br.r,br.y+br.r);
  hctx.globalAlpha=1;
  // Hint arrows if not moving
  if(joyId===null){
    hctx.globalAlpha=0.3;hctx.fillStyle='#0ff';hctx.font='12px Courier New';hctx.textAlign='center';
    hctx.fillText('MOZGAS',80,hud.height-80);
    hctx.globalAlpha=1;
  }
}

function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta();
  if(GS==='playing'){
    var dx=0,dz=0;
    if(keys['w']||keys['arrowup'])dz=-1;
    if(keys['s']||keys['arrowdown'])dz=1;
    if(keys['a']||keys['arrowleft'])dx=-1;
    if(keys['d']||keys['arrowright'])dx=1;
    dx+=jDX;dz+=jDZ;
    var len=Math.sqrt(dx*dx+dz*dz);if(len>1){dx/=len;dz/=len;}
    player.position.x=Math.max(-9,Math.min(9,player.position.x+dx*5*dt));
    player.position.z=Math.max(-9,Math.min(9,player.position.z+dz*5*dt));
    if(len>0.1){pAngle=Math.atan2(dx,dz);player.rotation.y=pAngle;}
    if(keys[' ']){keys[' ']=false;doAction();}
    var t=Date.now()*0.003;
    for(var i=0;i<tables.length;i++){if(tables[i].need){tables[i].ind.position.y=1.5+Math.sin(t+i)*0.2;tables[i].ind.scale.setScalar(0.8+Math.sin(t*2+i)*0.2);}if(tables[i].has){tables[i].cd--;if(tables[i].cd<=0){tables[i].has=false;tables[i].beer.visible=false;}}}
    camera.position.x+=(player.position.x-camera.position.x)*2*dt;
    camera.position.z+=(player.position.z+8-camera.position.z)*2*dt;
    camera.lookAt(player.position.x,0,player.position.z);
  }
  renderer.render(scene,camera);
  drawHud();
}

init();
</script>
</body>
</html>
